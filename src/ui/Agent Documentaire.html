<style>
:root{
  --brand-primary:#0B78E8;
  --brand-primary-dark:#0A5FBD;
  --brand-primary-soft:#EAF3FD;
  --brand-secondary:#0E2E2A;
  --brand-accent:#EE7513;
  --brand-accent-soft:#FDF1E6;
  --background:#F6F7F9;
  --surface:#FFFFFF;
  --surface-alt:#F2F4F6;
  --text-primary:#1F2A3A;
  --text-secondary:#6E7A87;
  --border:#E3E7EC;
  --success:#1E9E6A;
  --warning:#C98209;
  --error:#C9503C;
  --radius:8px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(31,42,58,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--background);-webkit-font-smoothing:antialiased}
a{color:var(--brand-primary);text-decoration:none}
a:hover{color:var(--brand-primary-dark)}
textarea,button,input{font-family:inherit}
::selection{background:#BFDDFA}
@keyframes om-spin{to{transform:rotate(360deg)}}
@keyframes om-pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* Hover deltas (mirrors the design's original per-element hover styles) */
.hov-surface-text:hover{background:var(--surface-alt);color:var(--text-primary)}
.hov-text:hover{color:var(--text-primary)}
.hov-border-link:hover{border-color:#B7D6F6;color:var(--brand-primary-dark)}
.hov-border:hover{border-color:#B7D6F6}
.hov-primary-dark:hover{background:var(--brand-primary-dark)}
.hov-surface-alt2:hover{background:#EDEFF2}
.hov-underline:hover{text-decoration-color:var(--brand-primary)}
.hov-surface-alt:hover{background:var(--surface-alt)}
.hov-delete:hover{background:#FBEFEC;color:var(--error)}
</style>

<script>
"use strict";

const API_BASE = "http://127.0.0.1:8000";

async function apiFetch(path, options) {
  const res = await fetch(API_BASE + path, Object.assign({
    headers: { "Content-Type": "application/json" }
  }, options || {}));
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((body && body.detail) || "Erreur serveur");
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

function formatDate(iso) {
  if (!iso) return "Aucune ingestion enregistrée";
  try {
    return "Dernière synchronisation · " + new Date(iso).toLocaleString("fr-FR", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch (e) { return "Aucune ingestion enregistrée"; }
}

function corpusIdFromUrl() {
  try {
    return new URLSearchParams(location.search).get("corpus_id") || "default";
  } catch (e) { return "default"; }
}

const props = { userName: "Yassine" };

const state = {
  corpusId: corpusIdFromUrl(),
  detail: null,
  corpusMissing: false,
  apiOffline: false,
  query: "",
  view: "empty",
  lastResponse: null,
  lastQuestion: "",
  execOpen: false,
  historyOpen: true,
  corpusOpen: false,
  sync: "idle",
  syncReport: null,
  activeHistoryId: null,
  pendingDeleteHistoryId: null,
  history: []
};

function setState(patch) {
  Object.assign(state, typeof patch === "function" ? patch(state) : patch);
  render();
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ---------------------------------------------------------------- */
/* Logique métier (identique au comportement original)               */
/* ---------------------------------------------------------------- */

async function checkHealth() {
  try {
    await apiFetch("/health");
    setState({ apiOffline: false });
  } catch (e) {
    setState({ apiOffline: true });
  }
}

async function loadCorpus() {
  try {
    const detail = await apiFetch("/corpora/" + encodeURIComponent(state.corpusId));
    setState({ detail, apiOffline: false, corpusMissing: false });
  } catch (e) {
    if (e.status === 404 || e.status === 422) {
      setState({ detail: null, corpusMissing: true });
    } else {
      setState({ detail: null });
    }
  }
}

function pushHistory(query, data) {
  // Snapshot COMPLET de la réponse déjà reçue — c'est cette copie locale,
  // jamais un nouvel appel réseau, qui permet à un clic ultérieur sur
  // cette entrée de réafficher exactement le même résultat (SUCCESS,
  // PARTIAL, REFUSAL ou ERROR). Ne conserve que des champs déjà présents
  // dans la réponse déjà montrée à l'utilisateur.
  const id = (window.crypto && window.crypto.randomUUID)
    ? window.crypto.randomUUID()
    : "h" + Date.now() + "-" + Math.random().toString(36).slice(2);
  setState(s => ({
    activeHistoryId: id,
    history: [{
      id,
      corpus_id: s.corpusId,
      corpus_name: s.detail ? s.detail.nom : s.corpusId,
      query,
      timestamp: new Date(),
      status: data.status,
      capability: data.capability || "",
      answer: data.answer || "",
      sources: data.sources || [],
      citations: data.citations || [],
      warnings: data.warnings || [],
      metadata: data.metadata || {},
      data: data.data || {},
      error: data.error || null
    }, ...s.history].slice(0, 12)
  }));
}

function selectHistoryEntry(id) {
  const entry = state.history.find(h => h.id === id);
  if (!entry) return;
  // Restauration LOCALE pure depuis le snapshot déjà stocké — aucun
  // fetch, aucun POST /query, aucune nouvelle génération LLM.
  setState({
    activeHistoryId: id,
    view: "result",
    lastQuestion: entry.query,
    lastResponse: {
      status: entry.status,
      capability: entry.capability,
      answer: entry.answer,
      sources: entry.sources,
      citations: entry.citations,
      warnings: entry.warnings,
      metadata: entry.metadata,
      data: entry.data,
      error: entry.error
    },
    execOpen: false
  });
}

function requestDeleteHistoryEntry(id) {
  setState({ pendingDeleteHistoryId: id });
}

function cancelDeleteHistoryEntry() {
  setState({ pendingDeleteHistoryId: null });
}

function confirmDeleteHistoryEntry(id) {
  setState(s => {
    const history = s.history.filter(h => h.id !== id);
    const base = { history, pendingDeleteHistoryId: null };
    if (s.activeHistoryId === id) {
      return Object.assign(base, {
        activeHistoryId: null,
        view: "empty", lastResponse: null, lastQuestion: "", execOpen: false
      });
    }
    return base;
  });
}

async function sendText(q) {
  q = (q || "").trim();
  if (!q || state.apiOffline || state.corpusMissing) return;
  setState({ view: "loading", lastQuestion: q, query: "", execOpen: false });
  try {
    const data = await apiFetch("/query", {
      method: "POST",
      body: JSON.stringify({ query: q, corpus_id: state.corpusId })
    });
    setState({ view: "result", lastResponse: data, apiOffline: false });
    pushHistory(q, data);
  } catch (e) {
    if (e.body && e.body.status) {
      setState({ view: "result", lastResponse: e.body, apiOffline: false });
      pushHistory(q, e.body);
    } else {
      setState({ view: "empty", apiOffline: true });
    }
  }
}

function send() { sendText(state.query); }
function onRetry() { sendText(state.lastQuestion); }
function onReset() { setState({ view: "empty", lastResponse: null, query: "", execOpen: false, activeHistoryId: null }); }

async function doSync() {
  const d = state.detail;
  if (!d || state.sync === "loading") return;
  setState({ sync: "loading" });
  try {
    const rapport = await apiFetch("/ingestion", {
      method: "POST",
      body: JSON.stringify({ source: d.source, corpus_id: state.corpusId, reinitialiser: false })
    });
    const detail = await apiFetch("/corpora/" + encodeURIComponent(state.corpusId));
    setState({ sync: "idle", syncReport: rapport, detail, apiOffline: false });
  } catch (e) {
    setState({ sync: "idle", syncReport: { erreur: true } });
  }
}

const EXAMPLES = [
  "Résume ce document en points clés.",
  "Quels sont les points importants à retenir ?",
  "Recherche les informations relatives à ce sujet."
];

/* ---------------------------------------------------------------- */
/* Valeurs dérivées (équivalent à renderVals())                       */
/* ---------------------------------------------------------------- */

function computeVals() {
  const st = state;
  const d = st.detail;
  const r = st.lastResponse;
  const hasWarnings = !!(r && r.warnings && r.warnings.length);

  const isSuccess = st.view === "result" && r && r.status === "success" && !hasWarnings;
  const isPartial = st.view === "result" && r && r.status === "success" && hasWarnings;
  const isRefusal = st.view === "result" && r && r.status === "refusal";
  const isError = st.view === "result" && r && r.status === "error";
  const result = isSuccess || isPartial || isRefusal || isError;

  const answerText = r ? r.answer || "" : "";
  const paragraphs = answerText
    ? answerText.split(/\n\s*\n/).filter(Boolean).map(t => ({ text: t, cites: [] }))
    : [];

  const sources = (r && r.sources) || [];
  const sourcesView = sources.map((s, i) => ({
    tag: s.citation || "S" + (i + 1),
    doc: s.document || "Document",
    page: s.page != null ? s.page : "—",
    category: s.categorie || "",
    excerpt: s.extrait || ""
  }));

  const rep = st.syncReport;
  let syncKind = null;
  if (rep && !rep.erreur) {
    const trouves = rep.fichiers_trouves || 0;
    const echecs = rep.fichiers_en_echec || 0;
    syncKind = trouves > 0 && echecs >= trouves ? "failed" : echecs > 0 ? "partial" : "success";
  } else if (rep && rep.erreur) {
    syncKind = "failed";
  }
  const syncLabelByKind = { success: "Synchronisation terminée", partial: "Synchronisation partielle", failed: "Synchronisation interrompue" };
  const syncTint = { success: "#177A53", partial: "#C98209", failed: "#C9503C" };
  const syncBg = { success: "#FBFDFC", partial: "#FFFDF8", failed: "#FFFCFB" };
  const syncBorder = { success: "#D9EDE4", partial: "#F0E3C8", failed: "#EFD9D3" };

  const execRows = r ? [
    { label: "CAPACITÉ", value: r.capability || "—" },
    { label: "STATUT", value: (r.error && r.error.code) || r.status },
    { label: "SOURCES", value: String(sources.length) },
    { label: "DURÉE", value: r.metadata && r.metadata.duree_secondes != null ? r.metadata.duree_secondes.toFixed(1).replace(".", ",") + " s" : "Non disponible" }
  ] : [];

  const historyForCorpus = st.history.filter(h => h.corpus_id === st.corpusId);

  return {
    userName: props.userName ?? "Yassine",
    corpusName: d ? d.nom : st.corpusId,
    corpusMeta: d ? d.document_count + " documents · " + d.chunk_count + " extraits indexés" : "Non disponible",
    corpusDomain: d && d.domain ? d.domain : "Non disponible",

    statusLabel: st.apiOffline ? "Service indisponible" : "Service disponible",
    statusDot: st.apiOffline ? "var(--warning)" : "var(--success)",
    apiOffline: st.apiOffline,
    corpusMissing: st.corpusMissing,

    isEmpty: st.view === "empty",
    isLoading: st.view === "loading",
    hasThread: st.view !== "empty",
    isSuccess, isPartial, isRefusal, isError,
    hasExecInfo: result,
    question: st.lastQuestion || "",
    capability: r ? r.capability : "",
    statusText: "Réponse fondée sur les documents indexés",
    partialWarning: hasWarnings ? r.warnings[0] : "",
    sourceCountLabel: sources.length + " source" + (sources.length > 1 ? "s" : "") + " citée" + (sources.length > 1 ? "s" : ""),
    paragraphs,
    sources: sourcesView,
    refusalHints: ["reformuler la question en la rattachant à un document précis ;", "synchroniser le corpus si de nouveaux documents ont été déposés."],
    errorMessage: (r && r.error && r.error.message) || "Une erreur interne est survenue.",
    skeletonRows: [{ w: "96%" }, { w: "88%" }, { w: "92%" }, { w: "54%" }],

    execOpen: st.execOpen,
    execChevron: st.execOpen ? "▾" : "▸",
    execRows,

    query: st.query,
    sendDisabled: st.apiOffline || st.corpusMissing || !st.query.trim(),
    sendOpacity: st.apiOffline || st.corpusMissing || !st.query.trim() ? 0.45 : 1,
    sendCursor: st.apiOffline || st.corpusMissing || !st.query.trim() ? "default" : "pointer",
    composerHint: st.apiOffline ? "Service indisponible — envoi suspendu" : st.corpusMissing ? "Corpus indisponible — envoi suspendu" : "L’agent choisit automatiquement la capacité adaptée",

    historyOpen: st.historyOpen !== false,
    historyClosed: st.historyOpen === false,

    corpusOpen: st.corpusOpen,
    corpusClosed: !st.corpusOpen,

    syncStatusLabel: st.sync === "loading" ? "Analyse et indexation en cours…" : formatDate(d ? d.last_sync_at : null),
    syncDot: st.sync === "loading" ? "var(--brand-primary)" : d && d.status === "ready" ? "var(--success)" : d && d.status === "partial" ? "var(--warning)" : "#C3CBD4",
    syncBusy: st.sync === "loading",
    syncOpacity: st.sync === "loading" ? 0.7 : 1,
    syncButtonLabel: st.sync === "loading" ? "Synchronisation…" : "Synchroniser les documents",
    hasSyncReport: !!syncKind,
    syncReportTitle: syncKind ? syncLabelByKind[syncKind] : "",
    syncReportTint: syncKind ? syncTint[syncKind] : "",
    syncReportBg: syncKind ? syncBg[syncKind] : "",
    syncReportBorder: syncKind ? syncBorder[syncKind] : "",
    syncNote: rep && rep.erreur ? "La synchronisation a échoué. L’index précédent reste actif." : rep && rep.fichiers_en_echec ? rep.fichiers_en_echec + " document(s) n’ont pas pu être traités." : "",
    syncStats: rep && !rep.erreur ? [
      { value: String(rep.fichiers_trouves), label: "fichiers trouvés" },
      { value: String(rep.fichiers_traites), label: "fichiers traités" },
      { value: String(rep.fichiers_en_echec), label: "échecs" },
      { value: String(rep.chunks_indexes), label: "extraits indexés" }
    ] : [],
    lastIngestion: formatDate(d ? d.last_sync_at : null),

    history: historyForCorpus.map(h => ({
      id: h.id,
      short: h.query.length > 68 ? h.query.slice(0, 68) + "…" : h.query,
      capability: h.capability,
      time: h.timestamp.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
      corpus: h.corpus_name,
      active: st.activeHistoryId === h.id ? "var(--brand-primary-soft)" : "transparent",
      confirmingDelete: st.pendingDeleteHistoryId === h.id,
      showNormal: st.pendingDeleteHistoryId !== h.id
    })),
    historyCount: String(historyForCorpus.length),
    historyEmpty: historyForCorpus.length === 0,

    examples: EXAMPLES
  };
}

function captureUi() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  const selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;
  const scroll = {};
  ["msg-scroll", "history-scroll", "corpus-scroll"].forEach(id => {
    const el = document.getElementById(id);
    if (el) scroll[id] = el.scrollTop;
  });
  return { activeId, selStart, selEnd, scroll };
}

function restoreUi(ui) {
  if (ui.activeId) {
    const el = document.getElementById(ui.activeId);
    if (el) {
      el.focus();
      if (ui.selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(ui.selStart, ui.selEnd); } catch (e) {}
      }
    }
  }
  Object.keys(ui.scroll).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.scrollTop = ui.scroll[id];
  });
}

    mainHtml += `
      <div>
        <h1 style="margin:0;font-size:23px;font-weight:600;line-height:1.3">Interrogation du corpus</h1>
        <p style="margin:8px 0 0;max-width:560px;font-size:14px;line-height:1.6;color:var(--text-secondary)">Formulez votre demande en langage naturel. La capacité appliquée (recherche, résumé, comparaison, extraction) est déterminée par l’agent et affichée avec la réponse.</p>
        <div style="margin-top:28px;border-top:1px solid var(--border);padding-top:16px">
          <div style="font-size:11.5px;font-weight:500;color:var(--text-secondary);margin-bottom:8px">Exemples de demandes</div>
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
            ${v.examples.map((ex, i) => `<button data-click="useExample" data-index="${i}" style="text-align:left;background:none;border:none;padding:0;font-size:13.5px;line-height:1.5;color:var(--brand-primary-dark);cursor:pointer;text-decoration:underline;text-decoration-color:#C9DFF6;text-underline-offset:3px" class="hov-underline">${esc(ex)}</button>`).join("")}
          </div>
        </div>
      </div>`;
  }

  if (v.hasThread) {
    mainHtml += `
      <div>
        <div style="font-size:11.5px;font-weight:500;color:var(--text-secondary)">Votre question</div>
        <div style="margin-top:6px;font-size:16.5px;font-weight:500;line-height:1.5;max-width:700px;text-wrap:pretty">${esc(v.question)}</div>
        <div style="height:1px;background:var(--border);margin:26px 0 0"></div>
      </div>`;
  }

  if (v.isLoading) {
    mainHtml += `
      <div style="margin-top:26px">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:13px;height:13px;border:2px solid #D6E6F7;border-top-color:var(--brand-primary);border-radius:999px;animation:om-spin .8s linear infinite"></div>
          <span style="font-size:13px;color:var(--text-secondary)">L’agent analyse le corpus documentaire…</span>
        </div>
        <div style="margin-top:22px;display:flex;flex-direction:column;gap:12px">
          ${v.skeletonRows.map(row => `<div style="height:11px;border-radius:3px;width:${row.w};background:#E7EBEF;animation:om-pulse 1.4s ease-in-out infinite"></div>`).join("")}
        </div>
      </div>`;
  }

  if (v.isSuccess) {
    mainHtml += `
      <div style="margin-top:26px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:7px;padding:3px 9px;border-radius:3px;background:var(--brand-primary-soft)">
            <span style="font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--text-secondary)">CAPACITÉ</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.07em;color:var(--brand-primary-dark)">${esc(v.capability)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:6px;height:6px;border-radius:999px;background:var(--success)"></div>
            <span style="font-size:12px;color:var(--text-secondary)">${esc(v.statusText)}</span>
          </div>
          <span style="font-size:12px;color:var(--text-secondary)">·</span>
          <span style="font-size:12px;color:var(--text-secondary)">${esc(v.sourceCountLabel)}</span>
        </div>
        <div style="margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
          <div style="padding:24px 26px 20px">
            ${v.paragraphs.map(para => `<p style="margin:0 0 15px;font-size:15px;line-height:1.72;color:var(--text-primary);text-wrap:pretty">${esc(para.text)}<span style="display:inline-flex;gap:3px;margin-left:5px">${para.cites.map(c => `<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;color:var(--brand-primary-dark);background:var(--brand-primary-soft);border-radius:3px;padding:1px 4px">${esc(c)}</span>`).join("")}</span></p>`).join("")}
          </div>
          <div style="border-top:1px solid var(--border);background:#FBFCFD;padding:18px 26px 22px">
            <div style="font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:12px">Sources citées</div>
            <div style="display:flex;flex-direction:column;gap:9px">${v.sources.map(sourceCard).join("")}</div>
          </div>
        </div>
      </div>`;
  }

  if (v.isPartial) {
    mainHtml += `
      <div style="margin-top:26px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:7px;padding:3px 9px;border-radius:3px;background:var(--brand-primary-soft)">
            <span style="font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--text-secondary)">CAPACITÉ</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.07em;color:var(--brand-primary-dark)">${esc(v.capability)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:6px;height:6px;border-radius:999px;background:var(--warning)"></div>
            <span style="font-size:12px;color:var(--text-secondary)">${esc(v.statusText)}</span>
          </div>
          <span style="font-size:12px;color:var(--text-secondary)">·</span>
          <span style="font-size:12px;color:var(--text-secondary)">${esc(v.sourceCountLabel)}</span>
        </div>
        <div style="margin-top:14px;border:1px solid #F0E3C8;background:#FFFBF2;border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;color:var(--text-primary)">${esc(v.partialWarning)}</div>
        <div style="margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
          <div style="padding:24px 26px 20px">
            ${v.paragraphs.map(para => `<p style="margin:0 0 15px;font-size:15px;line-height:1.72;color:var(--text-primary);text-wrap:pretty">${esc(para.text)}</p>`).join("")}
          </div>
          <div style="border-top:1px solid var(--border);background:#FBFCFD;padding:18px 26px 22px">
            <div style="font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:12px">Sources citées</div>
            <div style="display:flex;flex-direction:column;gap:9px">${v.sources.map(sourceCard).join("")}</div>
          </div>
        </div>
      </div>`;
  }

  if (v.isRefusal) {
    mainHtml += `
      <div style="margin-top:26px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:7px;padding:3px 9px;border-radius:3px;background:var(--surface-alt)">
            <span style="font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--text-secondary)">CAPACITÉ</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.07em;color:var(--text-primary)">${esc(v.capability)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:6px;height:6px;border-radius:999px;background:var(--warning)"></div>
            <span style="font-size:12px;color:var(--text-secondary)">Réponse non fournie</span>
          </div>
        </div>
        <div style="margin-top:20px;background:var(--surface);border:1px solid #F0E3C8;border-left:3px solid var(--warning);border-radius:var(--radius);padding:22px 26px">
          <div style="font-size:15.5px;font-weight:500;line-height:1.6;max-width:620px;text-wrap:pretty">Les documents disponibles ne permettent pas de fournir une réponse suffisamment fiable.</div>
          <div style="font-size:13.5px;line-height:1.7;color:var(--text-secondary);margin-top:12px;max-width:620px">Il ne s’agit pas d’une erreur : l’agent a trouvé des passages proches du sujet, mais aucun élément probant permettant d’étayer une réponse. Vous pouvez :</div>
          <div style="display:flex;flex-direction:column;gap:7px;margin-top:14px">
            ${v.refusalHints.map(hint => `
              <div style="display:flex;gap:9px;align-items:baseline">
                <div style="flex:none;width:4px;height:4px;border-radius:999px;background:var(--text-secondary);transform:translateY(-3px)"></div>
                <span style="font-size:13.5px;line-height:1.6;color:var(--text-primary)">${esc(hint)}</span>
              </div>`).join("")}
          </div>
        </div>
      </div>`;
  }

  if (v.isError) {
    mainHtml += `
      <div style="margin-top:26px">
        <div style="background:var(--surface);border:1px solid #EFD9D3;border-left:3px solid var(--error);border-radius:var(--radius);padding:22px 26px">
          <div style="display:flex;align-items:center;gap:9px">
            <div style="width:7px;height:7px;border-radius:999px;background:var(--error)"></div>
            <div style="font-size:15.5px;font-weight:500">Une erreur interne est survenue.</div>
          </div>
          <div style="font-size:13.5px;line-height:1.7;color:var(--text-secondary);margin-top:10px;max-width:600px">${esc(v.errorMessage)} Vous pouvez réessayer ; si le problème persiste, contactez le support.</div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap">
            <button data-click="onRetry" style="height:34px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;color:var(--text-primary);cursor:pointer" class="hov-border-link">Réessayer</button>
          </div>
        </div>
      </div>`;
  }

  if (v.hasExecInfo) {
    mainHtml += `
      <div style="margin-top:16px">
        <button data-click="toggleExec" style="background:none;border:none;padding:6px 0;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-secondary)" class="hov-text">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px">${v.execChevron}</span>
          <span style="font-size:12px;font-weight:500">Informations d’exécution</span>
        </button>
        ${!v.execOpen ? "" : `
        <div style="border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:16px 18px;margin-top:4px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px">
            ${v.execRows.map(row => `
              <div>
                <div style="font-size:10.5px;letter-spacing:.06em;font-weight:600;color:var(--text-secondary)">${esc(row.label)}</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-top:4px;word-break:break-all">${esc(row.value)}</div>
              </div>`).join("")}
          </div>
        </div>`}
      </div>`;
  }

  document.getElementById("main-content").innerHTML = mainHtml;

  /* ---- composeur ---- */
  const queryInput = document.getElementById("query-input");
  queryInput.value = v.query;
  document.getElementById("composer-hint").textContent = v.composerHint;
  document.getElementById("reset-region").innerHTML = !v.hasThread ? "" : `
    <button data-click="onReset" style="height:34px;padding:0 12px;border:none;background:none;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-secondary);cursor:pointer" class="hov-surface-text">Nouvelle question</button>`;
  const sendBtn = document.getElementById("send-btn");
  sendBtn.disabled = v.sendDisabled;
  sendBtn.style.cursor = v.sendCursor;
  sendBtn.style.opacity = v.sendOpacity;

  restoreUi(ui);
}

/* ---------------------------------------------------------------- */
/* Délégation d’événements                                            */
/* ---------------------------------------------------------------- */

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-click]");
  if (!el) return;
  const action = el.dataset.click;
  const id = el.dataset.id;
  if (action === "retryApi") { checkHealth(); loadCorpus(); }
  else if (action === "toggleHistory") setState(s => ({ historyOpen: s.historyOpen === false }));
  else if (action === "toggleCorpus") setState(s => ({ corpusOpen: !s.corpusOpen }));
  else if (action === "selectHistory") selectHistoryEntry(id);
  else if (action === "requestDeleteHistory") requestDeleteHistoryEntry(id);
  else if (action === "cancelDeleteHistory") cancelDeleteHistoryEntry();
  else if (action === "confirmDeleteHistory") confirmDeleteHistoryEntry(id);
  else if (action === "useExample") sendText(EXAMPLES[Number(el.dataset.index)]);
  else if (action === "toggleExec") setState(s => ({ execOpen: !s.execOpen }));
  else if (action === "onSync") doSync();
  else if (action === "onSend") send();
  else if (action === "onReset") onReset();
  else if (action === "onRetry") onRetry();
});

document.getElementById("query-input").addEventListener("input", (e) => {
  setState({ query: e.target.value });
});

document.getElementById("query-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

/* ---------------------------------------------------------------- */
/* Démarrage (équivalent à componentDidMount)                        */
/* ---------------------------------------------------------------- */

render();
checkHealth();
loadCorpus();
</script>
</body>
</html>
