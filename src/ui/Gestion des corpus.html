">\n                            <span style=\"font-size:12.5px\">{{ t.label }}<\u002Fspan>\n                            <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-secondary)\">{{ t.count }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"height:1px;background:var(--border);margin:14px 0\"><\u002Fdiv>\n                      <div style=\"font-size:11px;font-weight:600;color:var(--text-secondary)\">Catégories principales<\u002Fdiv>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\">\n                        <sc-for list=\"{{ profileCategories }}\" as=\"cat\" hint-placeholder-count=\"5\">\n                          <span style=\"font-size:11.5px;color:var(--brand-primary-dark);background:var(--brand-primary-soft);border:1px solid #D3E5FB;border-radius:3px;padding:3px 8px\">{{ cat }}<\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11px;color:var(--text-secondary);margin-top:12px\">Métadonnées exploitables : {{ profileMetadata }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ profileError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px solid #EFD9D3;background:#FFFCFB;border-radius:var(--radius-sm);padding:13px 15px\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <div style=\"width:6px;height:6px;border-radius:999px;background:var(--error)\"><\u002Fdiv>\n                  <span style=\"font-size:13px;font-weight:600\">L’analyse n’a pas abouti<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.6;color:var(--text-secondary);margin-top:8px\">{{ profileErrorMsg }} L’index reste utilisable ; relancez l’analyse pour obtenir le profil documentaire.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap\">\n              <sc-if value=\"{{ profileProposed }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ onValidateProfile }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--brand-primary-dark)\">Valider le profil<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ profileProposed }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ onProfile }}\" style=\"height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer\" style-hover=\"border-color:#B7D6F6;color:var(--brand-primary-dark)\">Régénérer la proposition<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ profileShowPrimary }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ onProfile }}\" disabled=\"{{ profileBtnDisabled }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:{{ profileBtnCursor }};display:flex;align-items:center;gap:8px;opacity:{{ profileBtnOpacity }}\" style-hover=\"background:var(--brand-primary-dark)\">\n                  <sc-if value=\"{{ profileBusy }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  {{ profileBtnLabel }}\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ profileDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ goStep4 }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--brand-primary-dark)\">Vérifier l’état du corpus<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ profileDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ onProfile }}\" style=\"background:none;border:none;padding:0;font-size:12px;color:var(--text-secondary);text-decoration:underline;cursor:pointer\" style-hover=\"color:var(--text-primary)\">Relancer le profiling<\u002Fbutton>\n              <\u002Fsc-if>\n              <span style=\"font-size:11.5px;color:var(--text-secondary)\">{{ profileHint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid {{ card4Border }};border-radius:var(--radius);background:{{ card4Bg }};box-shadow:var(--shadow)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)\">\n            <div style=\"font-size:14.5px;font-weight:600\">4. Corpus prêt<\u002Fdiv>\n            <sc-if value=\"{{ ready }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:#EAF7F1\">\n                <div style=\"width:5px;height:5px;border-radius:999px;background:var(--success)\"><\u002Fdiv>\n                <span style=\"font-size:10.5px;font-weight:600;color:#177A53\">Prêt<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-left:auto;font-size:11.5px;color:var(--text-secondary)\">{{ readyStateLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 20px 20px\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ checklist }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:9px\">\n                    <span style=\"width:13px;text-align:center;font-size:12px;color:{{ c.tint }}\">{{ c.mark }}<\u002Fspan>\n                    <span style=\"font-size:13px;color:{{ c.textColor }}\">{{ c.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:14px 15px;display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ summaryRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px\">\n                    <span style=\"font-size:11.5px;color:var(--text-secondary);min-width:140px\">{{ r.label }}<\u002Fspan>\n                    <span style=\"font-size:12.5px\">{{ r.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap\">\n              <a href=\"{{ interrogateHref }}\" style=\"height:38px;padding:0 18px;border-radius:var(--radius-sm);background:{{ readyBtnBg }};color:{{ readyBtnColor }};font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;pointer-events:{{ readyBtnEvents }};opacity:{{ readyBtnOpacity }}\" style-hover=\"filter:brightness(.94)\">Commencer à interroger ce corpus<span style=\"font-size:13px\">→<\u002Fspan><\u002Fa>\n              <span style=\"font-size:11.5px;color:var(--text-secondary)\">{{ readyHint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showCreateModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:50\">\n      <div style=\"width:420px;max-width:calc(100vw - 40px);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;box-sizing:border-box\">\n        <div style=\"font-size:15px;font-weight:600;margin-bottom:4px\">Nouveau corpus<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5\">Déclare un nouveau corpus logique. L’indexation se fait ensuite séparément, depuis l’étape 2.<\u002Fdiv>\n\n        <label for=\"create-nom\" style=\"display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px\">Nom du corpus<\u002Flabel>\n        <input id=\"create-nom\" type=\"text\" value=\"{{ createName }}\" sc-camel-on-change=\"{{ onCreateNameChange }}\" placeholder=\"ex. Ressources humaines\" style=\"width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text-primary);outline:none;box-sizing:border-box\" style-focus=\"border-color:#B7D6F6\">\n\n        <label for=\"create-id\" style=\"display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin:14px 0 6px\">Identifiant (corpus_id)<\u002Flabel>\n        <input id=\"create-id\" type=\"text\" value=\"{{ createId }}\" sc-camel-on-change=\"{{ onCreateIdChange }}\" placeholder=\"ex. ressources-humaines\" style=\"width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;font-family:'IBM Plex Mono',monospace;color:var(--text-primary);outline:none;box-sizing:border-box\" style-focus=\"border-color:#B7D6F6\">\n        <div style=\"font-size:11px;color:var(--text-secondary);margin-top:6px\">Minuscules, chiffres, tirets et underscores uniquement.<\u002Fdiv>\n\n        <sc-if value=\"{{ createError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;font-size:12px;color:var(--error);line-height:1.5\">{{ createError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:20px\">\n          <button sc-camel-on-click=\"{{ onCloseCreateModal }}\" disabled=\"{{ createBusy }}\" style=\"height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer\" style-hover=\"border-color:#B7D6F6\">Annuler<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onSubmitCreateCorpus }}\" disabled=\"{{ createSubmitDisabled }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;opacity:{{ createSubmitOpacity }}\" style-hover=\"background:var(--brand-primary-dark)\">\n            <sc-if value=\"{{ createBusy }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite\"><\u002Fdiv>\n            <\u002Fsc-if>\n            {{ createSubmitLabel }}\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDeleteModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:50\">\n      <div style=\"width:420px;max-width:calc(100vw - 40px);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;box-sizing:border-box\">\n        <div style=\"font-size:15px;font-weight:600;margin-bottom:10px\">Supprimer le corpus « {{ deleteModalName }} » ?<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.6;color:var(--text-secondary)\">Les documents importés, l’index Qdrant et les données associées à ce corpus seront supprimés définitivement.<\u002Fdiv>\n        <sc-if value=\"{{ deleteError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;font-size:12px;color:var(--error);line-height:1.5\">{{ deleteError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:20px\">\n          <button sc-camel-on-click=\"{{ onCloseDeleteModal }}\" disabled=\"{{ deleteBusy }}\" style=\"height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer\" style-hover=\"border-color:#B7D6F6\">Annuler<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onConfirmDeleteCorpus }}\" disabled=\"{{ deleteBusy }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--error);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px\" style-hover=\"filter:brightness(.9)\">\n            <sc-if value=\"{{ deleteBusy }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite\"><\u002Fdiv>\n            <\u002Fsc-if>\n            Supprimer\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Yassine&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst API_BASE = \"http://127.0.0.1:8000\";\n\n// Doit rester synchronisé avec le texte affiché « PDF, DOCX, TXT, XLSX » —\n// le backend accepte quelques formats de plus (md/csv/pptx/html), mais on ne\n// filtre/annonce ici que ce qui est réellement présenté à l'utilisateur.\nconst EXTENSIONS_ACCEPTEES = [\".pdf\", \".docx\", \".txt\", \".xlsx\"];\n\nfunction extensionDe(nomFichier) {\n  const idx = (nomFichier || \"\").lastIndexOf(\".\");\n  return idx === -1 ? \"\" : nomFichier.slice(idx).toLowerCase();\n}\n\nfunction estExtensionAcceptee(nomFichier) {\n  return EXTENSIONS_ACCEPTEES.indexOf(extensionDe(nomFichier)) !== -1;\n}\n\nfunction supporteSelectionDossier() {\n  try {\n    return \"webkitdirectory\" in document.createElement(\"input\");\n  } catch (e) {\n    return false;\n  }\n}\n\nasync function apiFetch(path, options) {\n  const res = await fetch(API_BASE + path, Object.assign({\n    headers: { \"Content-Type\": \"application/json\" }\n  }, options || {}));\n  let body = null;\n  try { body = await res.json(); } catch (e) {}\n  if (!res.ok) {\n    const err = new Error((body && body.detail) || \"Erreur serveur\");\n    err.status = res.status;\n    throw err;\n  }\n  return body;\n}\n\nfunction slugifyCorpusId(nom) {\n  return (nom || \"\")\n    .toString()\n    .normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\")\n    .toLowerCase()\n    .trim()\n    .replace(/[^a-z0-9]+/g, \"-\")\n    .replace(/^-+|-+$/g, \"\")\n    .slice(0, 64) || \"corpus\";\n}\n\nfunction formatDate(iso) {\n  if (!iso) return \"Non disponible\";\n  try {\n    return new Date(iso).toLocaleString(\"fr-FR\", { day: \"numeric\", month: \"short\", year: \"numeric\" });\n  } catch (e) { return \"Non disponible\"; }\n}\n\nconst BADGE = {\n  ready: [\"#EAF7F1\", \"#1E9E6A\", \"#177A53\"],\n  partial: [\"#FDF1E6\", \"#EE7513\", \"#B4570B\"],\n  profiling_required: [\"#FDF1E6\", \"#EE7513\", \"#B4570B\"],\n  indexation_required: [\"#F2F4F6\", \"#8A949E\", \"#5B6672\"],\n  error: [\"#FBEFEC\", \"#C9503C\", \"#A63E2D\"]\n};\nconst STATUS_LABEL = {\n  ready: \"Prêt\",\n  partial: \"Partiellement indexé\",\n  profiling_required: \"Profiling requis\",\n  indexation_required: \"Indexation requise\",\n  error: \"En erreur\"\n};\n\nclass Component extends DCLogic {\n  state = {\n    apiOffline: false,\n    corpora: [],\n    activeId: null,\n    detail: null,\n    step: 1,\n    indexBusy: false,\n    indexReport: null,\n    indexError: null,\n    profile: \"idle\",\n    inputTitle: \"\",\n    inputDomain: \"\",\n    draftDomain: \"\",\n    draftDescription: \"\",\n    draftKeywords: [],\n    newKeyword: \"\",\n    profileErrorMsg: \"\",\n    validatedAt: null,\n    deleteError: \"\",\n    deleteNotice: \"\",\n    uploadBusy: false,\n    uploadResultText: \"\",\n    uploadResultColor: \"\",\n    showConnectorPanel: false,\n    connectorsLoading: false,\n    remoteConnectors: [],\n    showUrlPanel: false,\n    importUrlValue: \"\",\n    importUrlBusy: false,\n    importUrlError: \"\",\n    showCreateModal: false,\n    createName: \"\",\n    createId: \"\",\n    createIdManuallyEdited: false,\n    createBusy: false,\n    createError: \"\",\n    showDeleteModal: false,\n    deleteBusy: false\n  };\n\n  componentDidMount() { this.load(); }\n  componentWillUnmount() {}\n\n  async load() {\n    try {\n      const corpora = await apiFetch(\"/corpora\");\n      this.setState({ corpora, apiOffline: false });\n      if (corpora.length) await this.select(corpora[0].corpus_id);\n    } catch (e) {\n      this.setState({ apiOffline: true });\n    }\n  }\n\n  async refreshList() {\n    try {\n      const corpora = await apiFetch(\"/corpora\");\n      this.setState({ corpora, apiOffline: false });\n    } catch (e) {\n      this.setState({ apiOffline: true });\n    }\n  }\n\n  select = async (corpusId) => {\n    try {\n      const detail = await apiFetch(\"/corpora/\" + encodeURIComponent(corpusId));\n      const step = detail.status === \"indexation_required\" ? 2 : detail.status === \"profiling_required\" ? 3 : 4;\n      this.setState({\n        activeId: corpusId, detail, step,\n        indexReport: null, indexError: null,\n        profile: \"idle\", inputTitle: detail.nom || corpusId, inputDomain: detail.domain || \"\",\n        draftDomain: \"\", draftDescription: \"\", draftKeywords: [], newKeyword: \"\",\n        profileErrorMsg: \"\", validatedAt: null,\n        apiOffline: false, deleteError: \"\", deleteNotice: \"\"\n      });\n    } catch (e) {\n      this.setState({ apiOffline: true });\n    }\n  };\n\n  openDeleteModal = () => {\n    const d = this.state.detail;\n    if (!d || d.corpus_id === \"default\") return;\n    this.setState({ showDeleteModal: true, deleteError: \"\" });\n  };\n\n  closeDeleteModal = () => {\n    if (this.state.deleteBusy) return;\n    this.setState({ showDeleteModal: false, deleteError: \"\" });\n  };\n\n  confirmDeleteCorpus = async () => {\n    const d = this.state.detail;\n    if (!d || this.state.deleteBusy) return;\n    this.setState({ deleteBusy: true, deleteError: \"\" });\n    try {\n      await apiFetch(\"/corpora/\" + encodeURIComponent(d.corpus_id), { method: \"DELETE\" });\n      const corpora = await apiFetch(\"/corpora\");\n      this.setState({\n        corpora, activeId: null, detail: null, step: 1,\n        indexReport: null, indexError: null, profile: \"idle\",\n        inputTitle: \"\", inputDomain: \"\", draftDomain: \"\", draftDescription: \"\",\n        draftKeywords: [], newKeyword: \"\", profileErrorMsg: \"\", validatedAt: null,\n        apiOffline: false, deleteBusy: false, deleteError: \"\", showDeleteModal: false,\n        deleteNotice: \"Corpus « \" + d.nom + \" » supprimé.\"\n      });\n    } catch (e) {\n      this.setState({ deleteBusy: false, deleteError: e.message || \"La suppression du corpus a échoué.\" });\n    }\n  };\n\n  openCreateModal = () => {\n    this.setState({\n      showCreateModal: true, createName: \"\", createId: \"\",\n      createIdManuallyEdited: false, createBusy: false, createError: \"\"\n    });\n  };\n\n  closeCreateModal = () => {\n    if (this.state.createBusy) return;\n    this.setState({ showCreateModal: false, createError: \"\" });\n  };\n\n  onCreateNameChange = (e) => {\n    const nom = e.target.value;\n    this.setState(s => ({\n      createName: nom,\n      createId: s.createIdManuallyEdited ? s.createId : slugifyCorpusId(nom)\n    }));\n  };\n\n  onCreateIdChange = (e) => {\n    this.setState({ createId: e.target.value, createIdManuallyEdited: true });\n  };\n\n  submitCreateCorpus = async () => {\n    const st = this.state;\n    const nom = (st.createName || \"\").trim();\n    const corpusId = slugifyCorpusId(st.createId || st.createName || \"\");\n    if (!nom || !corpusId || st.createBusy) return;\n    this.setState({ createBusy: true, createError: \"\" });\n    try {\n      // \"managed\" : ce corpus reçoit ses documents par upload de dossier ou\n      // import URL (stockage propre au corpus, jamais le dossier local\n      // partagé) — voir POST /corpora/{corpus_id}/upload|import-url.\n      await apiFetch(\"/corpora\", {\n        method: \"POST\",\n        body: JSON.stringify({ corpus_id: corpusId, name: nom, source: \"managed\" })\n      });\n      await this.refreshList();\n      await this.select(corpusId);\n      this.setState({ createBusy: false, showCreateModal: false });\n    } catch (e) {\n      const message = e.status === 409\n        ? \"Un corpus avec cet identifiant existe déjà.\"\n        : e.status === 422\n          ? (e.message || \"Identifiant de corpus invalide.\")\n          : (e.message || \"Impossible de créer le corpus.\");\n      this.setState({ createBusy: false, createError: message });\n    }\n  };\n\n  openFolderPicker = () => {\n    const input = document.getElementById(\"folder-input\");\n    if (input) input.click();\n  };\n\n  openFilesPicker = () => {\n    const input = document.getElementById(\"files-input\");\n    if (input) input.click();\n  };\n\n  onFolderPicked = (e) => {\n    const fichiers = Array.from((e.target && e.target.files) || []);\n    e.target.value = \"\";\n    this.handleFilesSelected(fichiers, { withRelativePath: true });\n  };\n\n  onFilesPicked = (e) => {\n    const fichiers = Array.from((e.target && e.target.files) || []);\n    e.target.value = \"\";\n    this.handleFilesSelected(fichiers, { withRelativePath: false });\n  };\n\n  handleFilesSelected = async (fichiers, { withRelativePath }) => {\n    if (!fichiers.length) {\n      this.setState({ uploadResultText: \"Aucun fichier n’a été sélectionné.\", uploadResultColor: \"var(--text-secondary)\" });\n      return;\n    }\n    const compatibles = fichiers.filter(f => estExtensionAcceptee(f.name));\n    const extensionsTrouvees = Array.from(new Set(compatibles.map(f => extensionDe(f.name).slice(1).toUpperCase())));\n\n    if (!compatibles.length) {\n      this.setState({\n        uploadResultText: \"Nouveau dossier sélectionné, mais aucun fichier PDF, DOCX, TXT ou XLSX compatible n’a été trouvé.\",\n        uploadResultColor: \"var(--warning)\"\n      });\n      return;\n    }\n\n    const d = this.state.detail;\n    if (!d) return;\n    if (d.source !== \"managed\") {\n      this.setState({\n        uploadResultText: \"Ce corpus n’est pas configuré pour recevoir des uploads (source actuelle : \" + d.source + \").\",\n        uploadResultColor: \"var(--error)\"\n      });\n      return;\n    }\n\n    this.setState({\n      uploadBusy: true,\n      uploadResultText: compatibles.length + \" fichier(s) sélectionné(s)\" + (extensionsTrouvees.length ? \" — \" + extensionsTrouvees.join(\", \") : \"\") + (compatibles.length < fichiers.length ? \" (\" + (fichiers.length - compatibles.length) + \" fichier(s) ignoré(s), format non pris en charge)\" : \"\") + \". Envoi en cours…\",\n      uploadResultColor: \"var(--text-secondary)\"\n    });\n\n    try {\n      const form = new FormData();\n      compatibles.forEach(f => form.append(\"files\", f, f.name));\n      compatibles.forEach(f => form.append(\"paths\", withRelativePath ? (f.webkitRelativePath || f.name) : f.name));\n      const res = await fetch(API_BASE + \"/corpora/\" + encodeURIComponent(d.corpus_id) + \"/upload\", {\n        method: \"POST\", body: form\n      });\n      const body = await res.json().catch(() => null);\n      if (!res.ok) throw Object.assign(new Error(\"upload\"), { body });\n      this.setState({\n        uploadBusy: false,\n        uploadResultText: (body.files_received || 0) + \" fichier(s) reçu(s) sur \" + compatibles.length + \" compatible(s) (\" + fichiers.length + \" sélectionné(s) au total). Lancez l’indexation pour les intégrer au corpus.\",\n        uploadResultColor: \"#177A53\"\n      });\n    } catch (err) {\n      const detail = (err.body && err.body.detail) || \"L’upload a échoué.\";\n      this.setState({ uploadBusy: false, uploadResultText: String(detail), uploadResultColor: \"var(--error)\" });\n    }\n  };\n\n  toggleConnectorPanel = async () => {\n    const opening = !this.state.showConnectorPanel;\n    this.setState({ showConnectorPanel: opening, showUrlPanel: false });\n    if (!opening) return;\n    this.setState({ connectorsLoading: true });\n    try {\n      const sources = await apiFetch(\"/sources\");\n      const distants = (sources || []).filter(s => s.type !== \"local\" && s.type !== \"managed\");\n      this.setState({ connectorsLoading: false, remoteConnectors: distants });\n    } catch (e) {\n      this.setState({ connectorsLoading: false, remoteConnectors: [] });\n    }\n  };\n\n  toggleUrlPanel = () => {\n    this.setState(s => ({ showUrlPanel: !s.showUrlPanel, showConnectorPanel: false, importUrlError: \"\" }));\n  };\n\n  submitImportUrl = async () => {\n    const d = this.state.detail;\n    const url = (this.state.importUrlValue || \"\").trim();\n    if (!d || !url) return;\n    if (d.source !== \"managed\") {\n      this.setState({ importUrlError: \"Ce corpus n’est pas configuré pour l’import URL (source actuelle : \" + d.source + \").\" });\n      return;\n    }\n    this.setState({ importUrlBusy: true, importUrlError: \"\" });\n    try {\n      const body = await apiFetch(\"/corpora/\" + encodeURIComponent(d.corpus_id) + \"/import-url\", {\n        method: \"POST\", body: JSON.stringify({ url })\n      });\n      this.setState({\n        importUrlBusy: false, importUrlValue: \"\", showUrlPanel: false,\n        uploadResultText: \"Document « \" + body.file_saved + \" » importé. Lancez l’indexation pour l’intégrer au corpus.\",\n        uploadResultColor: \"#177A53\"\n      });\n    } catch (e) {\n      this.setState({ importUrlBusy: false, importUrlError: e.message || \"L’import a échoué.\" });\n    }\n  };\n\n  goStep2 = () => this.setState({ step: 2 });\n  goStep3 = () => this.setState({ step: 3 });\n  goStep4 = () => this.setState({ step: 4 });\n\n  runIndex = async () => {\n    const d = this.state.detail;\n    if (!d || this.state.indexBusy) return;\n    this.setState({ indexBusy: true, indexError: null, step: 2 });\n    try {\n      const rapport = await apiFetch(\"/ingestion\", {\n        method: \"POST\",\n        body: JSON.stringify({ source: d.source, corpus_id: d.corpus_id, reinitialiser: false })\n      });\n      const detail = await apiFetch(\"/corpora/\" + encodeURIComponent(d.corpus_id));\n      await this.refreshList();\n      this.setState({ indexBusy: false, indexReport: rapport, detail, apiOffline: false });\n    } catch (e) {\n      this.setState({ indexBusy: false, indexError: \"L’indexation a échoué. L’index précédent reste inchangé.\" });\n    }\n  };\n\n  runProfile = async () => {\n    const d = this.state.detail;\n    const domain = (this.state.inputDomain || \"\").trim();\n    if (!d || !domain || this.state.profile === \"loading\") return;\n    this.setState({ profile: \"loading\", profileErrorMsg: \"\", step: 3 });\n    try {\n      const prop = await apiFetch(\"/corpora/\" + encodeURIComponent(d.corpus_id) + \"/profile\", {\n        method: \"POST\",\n        body: JSON.stringify({ domain: domain, output_language: \"fr\" })\n      });\n      this.setState({ profile: \"proposed\", draftDomain: prop.domain, draftDescription: prop.description, draftKeywords: (prop.keywords || []).slice(), newKeyword: \"\" });\n    } catch (e) {\n      this.setState({ profile: \"error\", profileErrorMsg: \"L’analyse n’a pas abouti.\" });\n    }\n  };\n\n  validateProfile = async () => {\n    const d = this.state.detail;\n    const st = this.state;\n    try {\n      const detail = await apiFetch(\"/corpora/\" + encodeURIComponent(d.corpus_id) + \"/profile/validate\", {\n        method: \"POST\",\n        body: JSON.stringify({ domain: st.draftDomain, description: st.draftDescription, keywords: st.draftKeywords, output_language: \"fr\" })\n      });\n      await this.refreshList();\n      this.setState({ profile: \"done\", detail, step: 4, validatedAt: new Date() });\n    } catch (e) {\n      this.setState({ profileErrorMsg: \"La validation a échoué.\" });\n    }\n  };\n\n  addKeyword = () => {\n    const k = (this.state.newKeyword || \"\").trim();\n    if (!k) return;\n    this.setState(s => ({ draftKeywords: s.draftKeywords.indexOf(k) >= 0 ? s.draftKeywords : s.draftKeywords.concat([k]), newKeyword: \"\" }));\n  };\n\n  renderVals() {\n    const st = this.state;\n    const d = st.detail;\n    const hasCorpus = !!d;\n\n    const indexDone = hasCorpus && d.chunk_count > 0;\n    const profileDone = hasCorpus && !!d.profile_name;\n    const ready = hasCorpus && d.status === \"ready\";\n\n    const stepState = [\n      \"done\",\n      st.indexBusy ? \"current\" : indexDone ? \"done\" : st.step === 2 ? \"current\" : \"todo\",\n      st.profile === \"loading\" ? \"current\" : profileDone ? \"done\" : st.step === 3 ? \"current\" : \"todo\",\n      ready ? \"done\" : st.step === 4 ? \"current\" : \"todo\"\n    ];\n    const labels = [\"Corpus\", \"Indexation\", \"Profiling\", \"Prêt\"];\n    const stateWords = { done: \"Terminé\", current: \"En cours\", todo: \"Non commencé\" };\n    const steps = labels.map((label, i) => {\n      const s = stepState[i];\n      return {\n        label, state: stateWords[s],\n        mark: s === \"done\" ? \"✓\" : s === \"current\" ? \"●\" : String(i + 1),\n        circleBg: s === \"done\" ? \"var(--success)\" : s === \"current\" ? \"var(--brand-primary)\" : \"var(--surface)\",\n        circleText: s === \"todo\" ? \"var(--text-secondary)\" : \"#fff\",\n        ringColor: s === \"done\" ? \"var(--success)\" : s === \"current\" ? \"var(--brand-primary)\" : \"var(--border)\",\n        labelColor: s === \"todo\" ? \"var(--text-secondary)\" : \"var(--text-primary)\",\n        weight: s === \"current\" ? 600 : 500,\n        lineColor: \"var(--border)\",\n        lineDisplay: i === 3 ? \"none\" : \"block\",\n        cursor: \"pointer\",\n        locked: false,\n        onClick: () => this.setState({ step: i + 1 })\n      };\n    });\n\n    const badgeFor = (status) => BADGE[status] || BADGE.indexation_required;\n    const corpora = st.corpora.map(c => {\n      const b = badgeFor(c.status);\n      return {\n        name: c.nom, status: STATUS_LABEL[c.status] || c.status,\n        meta: c.document_count + \" documents · \" + c.chunk_count + \" extraits\",\n        source: c.source,\n        badgeBg: b[0], badgeDot: b[1], badgeText: b[2],\n        hint: c.status === \"ready\" ? \"Interrogation disponible\" : \"Interrogation indisponible — préparation à terminer\",\n        hintColor: c.status === \"ready\" ? \"#177A53\" : \"var(--text-secondary)\",\n        bg: c.corpus_id === st.activeId ? \"var(--brand-primary-soft)\" : \"var(--surface)\",\n        onClick: () => this.select(c.corpus_id)\n      };\n    });\n\n    const report = st.indexReport;\n    const indexStats = [\n      { value: report ? String(report.fichiers_trouves) : \"Non disponible\", label: \"documents trouvés\", tint: \"var(--text-primary)\" },\n      { value: report ? String(report.fichiers_traites) : hasCorpus ? String(d.document_count) : \"—\", label: \"documents traités\", tint: \"var(--text-primary)\" },\n      { value: report ? String(report.fichiers_en_echec) : \"Non disponible\", label: \"documents en erreur\", tint: report && report.fichiers_en_echec ? \"var(--warning)\" : \"var(--text-primary)\" },\n      { value: report ? String(report.chunks_indexes) : hasCorpus ? String(d.chunk_count) : \"—\", label: \"extraits générés\", tint: \"var(--text-primary)\" }\n    ];\n    const pct = st.indexBusy ? 40 : report ? (report.fichiers_trouves ? Math.round((report.fichiers_traites / report.fichiers_trouves) * 100) : 100) : indexDone ? 100 : 0;\n    const hasFailures = !!(report && report.fichiers_en_echec > 0);\n    const totalFailure = !!(report && report.fichiers_trouves > 0 && report.fichiers_traites === 0);\n\n    const profileBtnDisabled = st.profile === \"loading\" || !(st.inputDomain || \"\").trim();\n\n    return {\n      userName: this.props.userName ?? \"Yassine\",\n      statusLabel: st.apiOffline ? \"Service indisponible\" : \"Service disponible\",\n      statusDot: st.apiOffline ? \"var(--warning)\" : \"var(--success)\",\n\n      corpusCount: String(st.corpora.length),\n      onNewCorpus: this.openCreateModal,\n      corpora,\n      deleteNotice: st.deleteNotice,\n\n      showCreateModal: st.showCreateModal,\n      createName: st.createName,\n      createId: st.createId,\n      onCreateNameChange: this.onCreateNameChange,\n      onCreateIdChange: this.onCreateIdChange,\n      onCloseCreateModal: this.closeCreateModal,\n      onSubmitCreateCorpus: this.submitCreateCorpus,\n      createBusy: st.createBusy,\n      createError: st.createError,\n      createSubmitLabel: st.createBusy ? \"Création…\" : \"Créer le corpus\",\n      createSubmitDisabled: st.createBusy || !(st.createName || \"\").trim() || !(st.createId || \"\").trim(),\n      createSubmitOpacity: st.createBusy || !(st.createName || \"\").trim() || !(st.createId || \"\").trim() ? 0.6 : 1,\n\n      steps,\n\n      card1Border: st.step === 1 ? \"#B7D6F6\" : \"var(--border)\",\n      step1State: \"Terminé\",\n      step1Hint: \"Le corpus sélectionné sera utilisé pour les étapes suivantes.\",\n      activeName: hasCorpus ? d.nom : \"Aucun corpus sélectionné\",\n      activeRows: hasCorpus ? [\n        { label: \"Source\", value: d.source },\n        { label: \"Documents indexés\", value: d.document_count + \" documents indexés\" },\n        { label: \"Date de création\", value: formatDate(d.created_at) },\n        { label: \"État\", value: STATUS_LABEL[d.status] || d.status }\n      ] : [],\n      canDeleteCorpus: hasCorpus && d.corpus_id !== \"default\",\n      onDeleteCorpus: this.openDeleteModal,\n      showDeleteModal: st.showDeleteModal,\n      deleteModalName: hasCorpus ? d.nom : \"\",\n      onCloseDeleteModal: this.closeDeleteModal,\n      onConfirmDeleteCorpus: this.confirmDeleteCorpus,\n      deleteBusy: st.deleteBusy,\n      deleteError: st.deleteError,\n      sourceOptions: [\n        { label: \"Parcourir un dossier\", onClick: this.openFolderPicker },\n        { label: \"Connecter un espace documentaire\", onClick: this.toggleConnectorPanel },\n        { label: \"Importer depuis une URL\", onClick: this.toggleUrlPanel }\n      ].concat(\n        supporteSelectionDossier() ? [] : [{ label: \"Importer des fichiers\", onClick: this.openFilesPicker }]\n      ),\n      folderHint: \"Sélectionnez le dossier lui-même. Les documents compatibles qu’il contient seront importés automatiquement.\",\n      onFolderPicked: this.onFolderPicked,\n      onFilesPicked: this.onFilesPicked,\n      uploadBusy: st.uploadBusy,\n      uploadResultText: st.uploadResultText,\n      uploadResultColor: st.uploadResultColor,\n\n
