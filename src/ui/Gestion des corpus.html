<style>
:root{
  --brand-primary:#0B78E8;
  --brand-primary-dark:#0A5FBD;
  --brand-primary-soft:#EAF3FD;
  --brand-secondary:#0E2E2A;
  --brand-accent:#EE7513;
  --brand-accent-soft:#FDF1E6;
  --background:#F6F7F9;
  --surface:#FFFFFF;
  --surface-alt:#F2F4F6;
  --text-primary:#1F2A3A;
  --text-secondary:#6E7A87;
  --border:#E3E7EC;
  --success:#1E9E6A;
  --warning:#C98209;
  --error:#C9503C;
  --radius:8px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(31,42,58,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--background);-webkit-font-smoothing:antialiased}
a{color:var(--brand-primary);text-decoration:none}
a:hover{color:var(--brand-primary-dark)}
textarea,button,input{font-family:inherit}
::selection{background:#BFDDFA}
@keyframes om-spin{to{transform:rotate(360deg)}}
@keyframes om-pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* Hover/focus deltas (mirrors the design's original per-element hover styles) */
.hov-border-link:hover{border-color:#B7D6F6;color:var(--brand-primary-dark)}
.hov-primary-dark:hover{background:var(--brand-primary-dark)}
.hov-brightness94:hover{filter:brightness(.94)}
.hov-brightness9:hover{filter:brightness(.9)}
.hov-border:hover{border-color:#B7D6F6}
.hov-text:hover{color:var(--text-primary)}
.hov-surface-alt:hover{background:var(--surface-alt)}
.hov-danger-fill:hover{background:var(--error);color:#fff;border-color:var(--error)}
.foc-border:focus{border-color:#B7D6F6}
</style>

<script>
"use strict";

const API_BASE = "http://127.0.0.1:8000";

/* Doit rester synchronisé avec le texte affiché « PDF, DOCX, TXT, XLSX » —
   le backend accepte quelques formats de plus (md/csv/pptx/html), mais on ne
   filtre/annonce ici que ce qui est réellement présenté à l'utilisateur. */
const EXTENSIONS_ACCEPTEES = [".pdf", ".docx", ".txt", ".xlsx"];

function extensionDe(nomFichier) {
  const idx = (nomFichier || "").lastIndexOf(".");
  return idx === -1 ? "" : nomFichier.slice(idx).toLowerCase();
}

function estExtensionAcceptee(nomFichier) {
  return EXTENSIONS_ACCEPTEES.indexOf(extensionDe(nomFichier)) !== -1;
}

function supporteSelectionDossier() {
  try {
    return "webkitdirectory" in document.createElement("input");
  } catch (e) {
    return false;
  }
}

async function apiFetch(path, options) {
  const res = await fetch(API_BASE + path, Object.assign({
    headers: { "Content-Type": "application/json" }
  }, options || {}));
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((body && body.detail) || "Erreur serveur");
    err.status = res.status;
    throw err;
  }
  return body;
}

function slugifyCorpusId(nom) {
  return (nom || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 64) || "corpus";
}

function formatDate(iso) {
  if (!iso) return "Non disponible";
  try {
    return new Date(iso).toLocaleString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
  } catch (e) { return "Non disponible"; }
}

  createError: "",
  showDeleteModal: false,
  deleteBusy: false
};

let createAbort = null;

function setState(patch) {
  Object.assign(state, typeof patch === "function" ? patch(state) : patch);
  render();
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ---------------------------------------------------------------- */
/* Logique métier (identique au comportement original)               */
/* ---------------------------------------------------------------- */

async function load() {
  try {
    const corpora = await apiFetch("/corpora");
    setState({ corpora, apiOffline: false });
    if (corpora.length) await select(corpora[0].corpus_id);
  } catch (e) {
    setState({ apiOffline: true });
  }
}

async function refreshList() {
  try {
    const corpora = await apiFetch("/corpora");
    setState({ corpora, apiOffline: false });
  } catch (e) {
    setState({ apiOffline: true });
  }
}

async function select(corpusId) {
  try {
    const detail = await apiFetch("/corpora/" + encodeURIComponent(corpusId));
    const step = detail.status === "indexation_required" ? 2 : detail.status === "profiling_required" ? 3 : 4;
    setState({
      activeId: corpusId, detail, step,
      indexReport: null, indexError: null,
      profile: "idle", inputTitle: detail.nom || corpusId, inputDomain: detail.domain || "",
      draftDomain: "", draftDescription: "", draftKeywords: [], newKeyword: "",
      profileErrorMsg: "", validatedAt: null,
      apiOffline: false, deleteError: "", deleteNotice: ""
    });
  } catch (e) {
    setState({ apiOffline: true });
  }
}

function openDeleteModal() {
  const d = state.detail;
  if (!d || d.corpus_id === "default") return;
  setState({ showDeleteModal: true, deleteError: "" });
}

function closeDeleteModal() {
  if (state.deleteBusy) return;
  setState({ showDeleteModal: false, deleteError: "" });
}

async function confirmDeleteCorpus() {
  const d = state.detail;
  if (!d || state.deleteBusy) return;
  setState({ deleteBusy: true, deleteError: "" });
  try {
    await apiFetch("/corpora/" + encodeURIComponent(d.corpus_id), { method: "DELETE" });
    const corpora = await apiFetch("/corpora");
    setState({
      corpora, activeId: null, detail: null, step: 1,
      indexReport: null, indexError: null, profile: "idle",
      inputTitle: "", inputDomain: "", draftDomain: "", draftDescription: "",
      draftKeywords: [], newKeyword: "", profileErrorMsg: "", validatedAt: null,
      apiOffline: false, deleteBusy: false, deleteError: "", showDeleteModal: false,
      deleteNotice: "Corpus « " + d.nom + " » supprimé."
    });
  } catch (e) {
    setState({ deleteBusy: false, deleteError: e.message || "La suppression du corpus a échoué." });
  }
}

function openCreateModal() {
  setState({
    showCreateModal: true, createName: "", createId: "",
    createIdManuallyEdited: false, createBusy: false, createError: ""
  });
}

function closeCreateModal() {
  if (state.createBusy) {
    if (createAbort) createAbort.abort();
    setState({ createBusy: false, showCreateModal: false, createError: "" });
    return;
  }
  setState({ showCreateModal: false, createError: "" });
}

function onCreateNameChange(value) {
  const nom = value;
  setState(s => ({
    createName: nom,
    createId: s.createIdManuallyEdited ? s.createId : slugifyCorpusId(nom)
  }));
}

function onCreateIdChange(value) {
  setState({ createId: value, createIdManuallyEdited: true });
}

async function submitCreateCorpus() {
  const st = state;
  const nom = (st.createName || "").trim();
  const corpusId = slugifyCorpusId(st.createId || st.createName || "");
  if (!nom || !corpusId || st.createBusy) return;
  const controller = new AbortController();
  createAbort = controller;
  const delaiMax = setTimeout(() => controller.abort(), 30000);
  setState({ createBusy: true, createError: "" });
  try {
    /* "managed" : ce corpus reçoit ses documents par upload de dossier ou
       import URL (stockage propre au corpus, jamais le dossier local
       partagé) — voir POST /corpora/{corpus_id}/upload|import-url. */
    await apiFetch("/corpora", {
      method: "POST",
      signal: controller.signal,
      body: JSON.stringify({ corpus_id: corpusId, name: nom, source: "managed" })
    });
    await refreshList();
    await select(corpusId);
    setState({ createBusy: false, showCreateModal: false });
  } catch (e) {
    const message = e.name === "AbortError"
      ? "Création annulée (délai dépassé ou annulation manuelle)."
      : e.status === 409
      ? "Un corpus avec cet identifiant existe déjà."
      : e.status === 422
        ? (e.message || "Identifiant de corpus invalide.")
        : (e.message || "Impossible de créer le corpus.");
    setState({ createBusy: false, createError: message });
  } finally {
    clearTimeout(delaiMax);
    createAbort = null;
  }
}

function openFolderPicker() {
  const d = state.detail;
  if (d && d.source !== "managed") {
    setState({
      uploadResultText: "Ce corpus n’est pas configuré pour recevoir des uploads (source actuelle : " + d.source + ").",
      uploadResultColor: "var(--error)"
    });
    return;
  }
  const input = document.getElementById("folder-input");
  if (input) input.click();
}

function openFilesPicker() {
  const d = state.detail;
  if (d && d.source !== "managed") {
    setState({
      uploadResultText: "Ce corpus n’est pas configuré pour recevoir des uploads (source actuelle : " + d.source + ").",
      uploadResultColor: "var(--error)"
    });
    return;
  }
  const input = document.getElementById("files-input");
  if (input) input.click();
}

function onFolderPicked(e) {
  const fichiers = Array.from((e.target && e.target.files) || []);
  e.target.value = "";
  handleFilesSelected(fichiers, { withRelativePath: true });
}

function onFilesPicked(e) {
  const fichiers = Array.from((e.target && e.target.files) || []);
  e.target.value = "";
  handleFilesSelected(fichiers, { withRelativePath: false });
}

async function handleFilesSelected(fichiers, opts) {
  const withRelativePath = opts.withRelativePath;
  if (!fichiers.length) {
    setState({ uploadResultText: "Aucun fichier n’a été sélectionné.", uploadResultColor: "var(--text-secondary)" });
    return;
  }
  const compatibles = fichiers.filter(f => estExtensionAcceptee(f.name));
  const extensionsTrouvees = Array.from(new Set(compatibles.map(f => extensionDe(f.name).slice(1).toUpperCase())));

  if (!compatibles.length) {
    setState({
      uploadResultText: "Nouveau dossier sélectionné, mais aucun fichier PDF, DOCX, TXT ou XLSX compatible n’a été trouvé.",
      uploadResultColor: "var(--warning)"
    });
    return;
  }

  const d = state.detail;
  if (!d) return;
  if (d.source !== "managed") {
    setState({
      uploadResultText: "Ce corpus n’est pas configuré pour recevoir des uploads (source actuelle : " + d.source + ").",
      uploadResultColor: "var(--error)"
    });
    return;
  }

  setState({
    uploadBusy: true,
    uploadResultText: compatibles.length + " fichier(s) sélectionné(s)" + (extensionsTrouvees.length ? " — " + extensionsTrouvees.join(", ") : "") + (compatibles.length < fichiers.length ? " (" + (fichiers.length - compatibles.length) + " fichier(s) ignoré(s), format non pris en charge)" : "") + ". Envoi en cours…",
    uploadResultColor: "var(--text-secondary)"
  });

  try {
    const form = new FormData();
    compatibles.forEach(f => form.append("files", f, f.name));
    compatibles.forEach(f => form.append("paths", withRelativePath ? (f.webkitRelativePath || f.name) : f.name));
    const res = await fetch(API_BASE + "/corpora/" + encodeURIComponent(d.corpus_id) + "/upload", {
      method: "POST", body: form
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw Object.assign(new Error("upload"), { body });
    setState({
      uploadBusy: false,
      uploadResultText: (body.files_received || 0) + " fichier(s) reçu(s) sur " + compatibles.length + " compatible(s) (" + fichiers.length + " sélectionné(s) au total). Lancez l’indexation pour les intégrer au corpus.",
      uploadResultColor: "#177A53"
    });
  } catch (err) {
    const detail = (err.body && err.body.detail) || "L’upload a échoué.";
    setState({ uploadBusy: false, uploadResultText: String(detail), uploadResultColor: "var(--error)" });
  }
}

async function toggleConnectorPanel() {
  const opening = !state.showConnectorPanel;
  setState({ showConnectorPanel: opening, showUrlPanel: false });
  if (!opening) return;
  setState({ connectorsLoading: true });
  try {
    const sources = await apiFetch("/sources");
    const distants = (sources || []).filter(s => s.type !== "local" && s.type !== "managed");
    setState({ connectorsLoading: false, remoteConnectors: distants });
  } catch (e) {
    setState({ connectorsLoading: false, remoteConnectors: [] });
  }
}

function toggleUrlPanel() {
  setState(s => ({ showUrlPanel: !s.showUrlPanel, showConnectorPanel: false, importUrlError: "" }));
}

async function submitImportUrl() {
  const d = state.detail;
  const url = (state.importUrlValue || "").trim();
  if (!d || !url) return;
  if (d.source !== "managed") {
    setState({ importUrlError: "Ce corpus n’est pas configuré pour l’import URL (source actuelle : " + d.source + ")." });
    return;
  }
  setState({ importUrlBusy: true, importUrlError: "" });
  try {
    const body = await apiFetch("/corpora/" + encodeURIComponent(d.corpus_id) + "/import-url", {
      method: "POST", body: JSON.stringify({ url })
    });
    setState({
      importUrlBusy: false, importUrlValue: "", showUrlPanel: false,
      uploadResultText: "Document « " + body.file_saved + " » importé. Lancez l’indexation pour l’intégrer au corpus.",
      uploadResultColor: "#177A53"
    });
  } catch (e) {
    setState({ importUrlBusy: false, importUrlError: e.message || "L’import a échoué." });
  }
}

async function runIndex() {
  const d = state.detail;
  if (!d || state.indexBusy) return;
  setState({ indexBusy: true, indexError: null, step: 2 });
  try {
    const rapport = await apiFetch("/ingestion", {
      method: "POST",
      body: JSON.stringify({ source: d.source, corpus_id: d.corpus_id, reinitialiser: false })
    });
    const detail = await apiFetch("/corpora/" + encodeURIComponent(d.corpus_id));
    await refreshList();
    setState({ indexBusy: false, indexReport: rapport, detail, apiOffline: false });
  } catch (e) {
    setState({ indexBusy: false, indexError: "L’indexation a échoué. L’index précédent reste inchangé." });
  }
}

async function runProfile() {
  const d = state.detail;
  const domain = (state.inputDomain || "").trim();
  if (!d || !domain || state.profile === "loading") return;
  setState({ profile: "loading", profileErrorMsg: "", step: 3 });
  try {
    const prop = await apiFetch("/corpora/" + encodeURIComponent(d.corpus_id) + "/profile", {
      method: "POST",
      body: JSON.stringify({ domain: domain, output_language: "fr" })
    });
    setState({ profile: "proposed", draftDomain: prop.domain, draftDescription: prop.description, draftKeywords: (prop.keywords || []).slice(), newKeyword: "" });
  } catch (e) {
    setState({ profile: "error", profileErrorMsg: "L’analyse n’a pas abouti." });
  }
}

async function validateProfile() {
  const d = state.detail;
  const st = state;
  try {
    const detail = await apiFetch("/corpora/" + encodeURIComponent(d.corpus_id) + "/profile/validate", {
      method: "POST",
      body: JSON.stringify({ domain: st.draftDomain, description: st.draftDescription, keywords: st.draftKeywords, output_language: "fr" })
    });
    await refreshList();
    setState({ profile: "done", detail, step: 4, validatedAt: new Date() });
  } catch (e) {
    setState({ profileErrorMsg: "La validation a échoué." });
  }
}

function addKeyword() {
  const k = (state.newKeyword || "").trim();
  if (!k) return;
  setState(s => ({ draftKeywords: s.draftKeywords.indexOf(k) >= 0 ? s.draftKeywords : s.draftKeywords.concat([k]), newKeyword: "" }));
}

function removeKeyword(k) {
  setState(s => ({ draftKeywords: s.draftKeywords.filter(x => x !== k) }));
}

/* ---------------------------------------------------------------- */
/* Valeurs dérivées (équivalent à renderVals())                       */
/* ---------------------------------------------------------------- */

function computeVals() {
  const st = state;
  const d = st.detail;
  const hasCorpus = !!d;

  const indexDone = hasCorpus && d.chunk_count > 0;
  const profileDone = hasCorpus && !!d.profile_name;
  const ready = hasCorpus && d.status === "ready";

  const stepState = [
    "done",
    st.indexBusy ? "current" : indexDone ? "done" : st.step === 2 ? "current" : "todo",
    st.profile === "loading" ? "current" : profileDone ? "done" : st.step === 3 ? "current" : "todo",
    ready ? "done" : st.step === 4 ? "current" : "todo"
  ];
  const labels = ["Corpus", "Indexation", "Profiling", "Prêt"];
  const stateWords = { done: "Terminé", current: "En cours", todo: "Non commencé" };
  const steps = labels.map((label, i) => {
    const s = stepState[i];
    return {
      label, state: stateWords[s],
      mark: s === "done" ? "✓" : s === "current" ? "●" : String(i + 1),
      circleBg: s === "done" ? "var(--success)" : s === "current" ? "var(--brand-primary)" : "var(--surface)",
      circleText: s === "todo" ? "var(--text-secondary)" : "#fff",
      ringColor: s === "done" ? "var(--success)" : s === "current" ? "var(--brand-primary)" : "var(--border)",
      labelColor: s === "todo" ? "var(--text-secondary)" : "var(--text-primary)",
      weight: s === "current" ? 600 : 500,
      lineDisplay: i === 3 ? "none" : "block",
      step: i + 1
    };
  });

  const badgeFor = (status) => BADGE[status] || BADGE.indexation_required;
  const corpora = st.corpora.map(c => {
    const b = badgeFor(c.status);
    return {
      id: c.corpus_id,
      name: c.nom, status: STATUS_LABEL[c.status] || c.status,
      meta: c.document_count + " documents · " + c.chunk_count + " extraits",
      source: c.source,
      badgeBg: b[0], badgeDot: b[1], badgeText: b[2],
      hint: c.status === "ready" ? "Interrogation disponible" : "Interrogation indisponible — préparation à terminer",
      hintColor: c.status === "ready" ? "#177A53" : "var(--text-secondary)",
      bg: c.corpus_id === st.activeId ? "var(--brand-primary-soft)" : "var(--surface)"
    };
  });

  const report = st.indexReport;
  const indexStats = [
    { value: report ? String(report.fichiers_trouves) : "Non disponible", label: "documents trouvés", tint: "var(--text-primary)" },
    { value: report ? String(report.fichiers_traites) : hasCorpus ? String(d.document_count) : "—", label: "documents traités", tint: "var(--text-primary)" },
    { value: report ? String(report.fichiers_en_echec) : "Non disponible", label: "documents en erreur", tint: report && report.fichiers_en_echec ? "var(--warning)" : "var(--text-primary)" },
    { value: report ? String(report.chunks_indexes) : hasCorpus ? String(d.chunk_count) : "—", label: "extraits générés", tint: "var(--text-primary)" }
  ];
  const pct = st.indexBusy ? 40 : report ? (report.fichiers_trouves ? Math.round((report.fichiers_traites / report.fichiers_trouves) * 100) : 100) : indexDone ? 100 : 0;
  const hasFailures = !!(report && report.fichiers_en_echec > 0);
  const totalFailure = !!(report && report.fichiers_trouves > 0 && report.fichiers_traites === 0);

  const profileBtnDisabled = st.profile === "loading" || !(st.inputDomain || "").trim();

  return {
    userName: props.userName ?? "Yassine",
    statusLabel: st.apiOffline ? "Service indisponible" : "Service disponible",
    statusDot: st.apiOffline ? "var(--warning)" : "var(--success)",

    corpusCount: String(st.corpora.length),
    corpora,
    deleteNotice: st.deleteNotice,

    showCreateModal: st.showCreateModal,
    createName: st.createName,
    createId: st.createId,
    createBusy: st.createBusy,
    createError: st.createError,
    createSubmitLabel: st.createBusy ? "Création…" : "Créer le corpus",
    createSubmitDisabled: st.createBusy || !(st.createName || "").trim() || !(st.createId || "").trim(),
    createSubmitOpacity: st.createBusy || !(st.createName || "").trim() || !(st.createId || "").trim() ? 0.6 : 1,

    steps,

    card1Border: st.step === 1 ? "#B7D6F6" : "var(--border)",
    step1State: "Terminé",
    step1Hint: "Le corpus sélectionné sera utilisé pour les étapes suivantes.",
    activeName: hasCorpus ? d.nom : "Aucun corpus sélectionné",
    activeRows: hasCorpus ? [
      { label: "Source", value: d.source },
      { label: "Documents indexés", value: d.document_count + " documents indexés" },
      { label: "Date de création", value: formatDate(d.created_at) },
      { label: "État", value: STATUS_LABEL[d.status] || d.status }
    ] : [],
    canDeleteCorpus: hasCorpus && d.corpus_id !== "default",
    showDeleteModal: st.showDeleteModal,
    deleteModalName: hasCorpus ? d.nom : "",
    deleteBusy: st.deleteBusy,
    deleteError: st.deleteError,
    sourceOptions: [
      { label: "Parcourir un dossier", action: "openFolderPicker" },
      { label: "Connecter un espace documentaire", action: "toggleConnectorPanel" },
      { label: "Importer depuis une URL", action: "toggleUrlPanel" }
    ].concat(
      supporteSelectionDossier() ? [] : [{ label: "Importer des fichiers", action: "openFilesPicker" }]
    ),
    folderHint: "Sélectionnez le dossier lui-même. Les documents compatibles qu’il contient seront importés automatiquement.",
    uploadBusy: st.uploadBusy,
    uploadResultText: st.uploadResultText,
    uploadResultColor: st.uploadResultColor,

    showConnectorPanel: st.showConnectorPanel,
    connectorsLoading: st.connectorsLoading,
    remoteConnectors: st.remoteConnectors.map(c => ({ label: c.name })),
    hasRemoteConnectors: st.remoteConnectors.length > 0,
    noRemoteConnectors: st.remoteConnectors.length === 0,

    showUrlPanel: st.showUrlPanel,
    importUrlValue: st.importUrlValue,
    importUrlBusy: st.importUrlBusy,
    importUrlBtnLabel: st.importUrlBusy ? "Import en cours…" : "Importer",
    importUrlError: st.importUrlError,

    card2Border: st.step === 2 ? "#B7D6F6" : "var(--border)",
    indexStateLabel: st.indexBusy ? "En cours" : indexDone ? "Terminée" : "En attente",
    indexDot: st.indexBusy ? "var(--brand-primary)" : indexDone ? "var(--success)" : "#C3CBD4",
    indexStats,
    indexProgressLabel: st.indexBusy ? "Indexation en cours…" : report ? report.fichiers_traites + " / " + report.fichiers_trouves + " documents indexés" : indexDone ? d.document_count + " documents indexés" : "Aucune indexation lancée",
    indexPercentLabel: pct + " %",
    indexBarWidth: pct + "%",
    indexBarColor: hasFailures ? "var(--warning)" : (indexDone || pct === 100) ? "var(--success)" : "var(--brand-primary)",
    indexBusy: st.indexBusy,
    indexDone,
    indexBtnLabel: st.indexBusy ? "Indexation en cours…" : indexDone ? "Relancer l’indexation" : "Lancer l’indexation",
    indexBtnBg: indexDone && !st.indexBusy ? "var(--surface)" : "var(--brand-primary)",
    indexBtnColor: indexDone && !st.indexBusy ? "var(--text-primary)" : "#fff",
    indexBtnOpacity: st.indexBusy ? 0.75 : 1,
    indexHint: st.indexBusy ? "Vous pouvez quitter la page, le traitement continue côté serveur." : st.indexError ? st.indexError : indexDone ? "✓ Indexation terminée" : "Ingestion synchrone — la durée dépend du volume de documents.",
    indexHasNote: hasFailures || totalFailure || !!st.indexError,
    indexNote: st.indexError ? st.indexError : totalFailure ? "L’indexation a échoué pour tous les documents trouvés. L’index précédent reste actif." : hasFailures ? report.fichiers_en_echec + " document(s) n’ont pas pu être traités. Les autres documents sont indexés et interrogeables." : "",
    indexNoteBg: hasFailures && !totalFailure ? "#FFFDF8" : "#FFFCFB",
    indexNoteBorder: hasFailures && !totalFailure ? "#F0E3C8" : "#EFD9D3",

    card3Border: st.step === 3 ? "#B7D6F6" : "var(--border)",
    profileIdle: st.profile === "idle",
    profileBusy: st.profile === "loading",
    profileProposed: st.profile === "proposed",
    profileDone: st.profile === "done" || (profileDone && st.profile === "idle"),
    profileError: st.profile === "error",
    profileErrorMsg: st.profileErrorMsg,
    profileShowPrimary: st.profile === "idle" || st.profile === "loading" || st.profile === "error",
    profileBtnLabel: st.profile === "loading" ? "Analyse en cours…" : st.profile === "error" ? "Relancer l’analyse" : "Proposer un profil",
    profileBtnOpacity: st.profile === "loading" ? 0.75 : (profileBtnDisabled ? 0.5 : 1),
    profileBtnDisabled,
    profileBtnCursor: profileBtnDisabled ? "default" : "pointer",

    inputTitle: st.inputTitle,
    inputDomain: st.inputDomain,
    domainSuggestions: ["Ressources humaines", "Juridique", "Finance", "Qualité et conformité"],
    draftDomain: st.draftDomain,
    draftDescription: st.draftDescription,
    draftKeywords: st.draftKeywords || [],
    newKeyword: st.newKeyword,
    profileHint: (st.profile === "done" || profileDone) ? "Le profiling n’est nécessaire qu’une fois par corpus." : st.profile === "proposed" ? "Rien n’est enregistré avant validation." : st.profile === "loading" ? "Génération en cours à partir du domaine indiqué." : (st.inputDomain || "").trim() ? "Étape réalisée une seule fois, à la création du corpus." : "Renseignez le domaine pour lancer la proposition.",
    profileDate: st.validatedAt ? "Validé le " + st.validatedAt.toLocaleString("fr-FR") : "Non disponible",
    profileDomain: st.draftDomain || (hasCorpus ? d.domain : "") || "Non disponible",
    profileDescription: st.draftDescription || "Non disponible",
    profileLanguage: "Non disponible",
    profilePeriod: "Non disponible",
    profileTypes: [{ label: "Non disponible", count: "—" }],
    profileCategories: (st.draftKeywords && st.draftKeywords.length) ? st.draftKeywords : ["Non disponible"],
    profileMetadata: "Non disponible",

    card4Border: ready ? "#D9EDE4" : "var(--border)",
    card4Bg: ready ? "#FBFDFC" : "var(--surface)",
    ready,
    readyStateLabel: ready ? "Corpus utilisable" : "Étapes restantes à compléter",
    checklist: [
      { label: "Documents indexés", ok: indexDone },
      { label: "Profil du corpus généré", ok: profileDone },
      { label: "Index disponible", ok: indexDone },
      { label: "Corpus prêt pour l’interrogation", ok: ready }
    ].map(x => ({
      label: x.label,
      mark: x.ok ? "✓" : "○",
      tint: x.ok ? "var(--success)" : "var(--text-secondary)",
      textColor: x.ok ? "var(--text-primary)" : "var(--text-secondary)"
    })),
    summaryRows: hasCorpus ? [
      { label: "Nom du corpus", value: d.nom },
      { label: "Documents", value: String(d.document_count) },
      { label: "Extraits indexés", value: String(d.chunk_count) },
      { label: "Domaine détecté", value: d.domain || "Non disponible" },
      { label: "Dernière synchronisation", value: formatDate(d.last_sync_at) }
    ] : [],
    interrogateHref: ready ? "Agent Documentaire.html?corpus_id=" + encodeURIComponent(d.corpus_id) : "#",
    readyBtnBg: ready ? "var(--brand-primary)" : "var(--surface-alt)",
    readyBtnColor: ready ? "#fff" : "var(--text-secondary)",
    readyBtnEvents: ready ? "auto" : "none",
    readyBtnOpacity: ready ? 1 : 0.6,

/* Rendu                                                              */
/* ---------------------------------------------------------------- */

function captureUi() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  const selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;
  const scroll = {};
  const pageScroll = document.getElementById("page-scroll");
  if (pageScroll) scroll["page-scroll"] = pageScroll.scrollTop;
  return { activeId, selStart, selEnd, scroll };
}

function restoreUi(ui) {
  if (ui.activeId) {
    const el = document.getElementById(ui.activeId);
    if (el) {
      el.focus();
      if (ui.selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(ui.selStart, ui.selEnd); } catch (e) {}
      }
    }
  }
  Object.keys(ui.scroll).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.scrollTop = ui.scroll[id];
  });
}

                <div style="font-size:12.5px;line-height:1.65;color:var(--text-secondary);margin-top:11px">${esc(v.profileDescription)}</div>
                <div style="display:flex;align-items:baseline;gap:10px;margin-top:13px">
                  <span style="font-size:11.5px;color:var(--text-secondary);min-width:120px">Langue principale</span>
                  <span style="font-size:12.5px">${esc(v.profileLanguage)}</span>
                </div>
                <div style="display:flex;align-items:baseline;gap:10px;margin-top:7px">
                  <span style="font-size:11.5px;color:var(--text-secondary);min-width:120px">Période couverte</span>
                  <span style="font-size:12.5px">${esc(v.profilePeriod)}</span>
                </div>
              </div>
              <div style="padding:15px 16px;background:#FBFCFD">
                <div style="font-size:11px;font-weight:600;color:var(--text-secondary)">Types de documents identifiés</div>
                <div style="display:flex;flex-direction:column;gap:6px;margin-top:9px">
                  ${v.profileTypes.map(t => `
                    <div style="display:flex;align-items:baseline;gap:10px">
                      <span style="font-size:12.5px">${esc(t.label)}</span>
                      <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-secondary)">${esc(t.count)}</span>
                    </div>`).join("")}
                </div>
                <div style="height:1px;background:var(--border);margin:14px 0"></div>
                <div style="font-size:11px;font-weight:600;color:var(--text-secondary)">Catégories principales</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">
                  ${v.profileCategories.map(cat => `<span style="font-size:11.5px;color:var(--brand-primary-dark);background:var(--brand-primary-soft);border:1px solid #D3E5FB;border-radius:3px;padding:3px 8px">${esc(cat)}</span>`).join("")}
                </div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:12px">Métadonnées exploitables : ${esc(v.profileMetadata)}</div>
              </div>
            </div>
          </div>
        </div>`}

        ${!v.profileError ? "" : `
        <div style="border:1px solid #EFD9D3;background:#FFFCFB;border-radius:var(--radius-sm);padding:13px 15px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:6px;height:6px;border-radius:999px;background:var(--error)"></div>
            <span style="font-size:13px;font-weight:600">L’analyse n’a pas abouti</span>
          </div>
          <div style="font-size:12.5px;line-height:1.6;color:var(--text-secondary);margin-top:8px">${esc(v.profileErrorMsg)} L’index reste utilisable ; relancez l’analyse pour obtenir le profil documentaire.</div>
        </div>`}

        <div style="display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap">
          ${!v.profileProposed ? "" : `<button data-click="onValidateProfile" style="height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer" class="hov-primary-dark">Valider le profil</button>`}
          ${!v.profileProposed ? "" : `<button data-click="onProfile" style="height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer" class="hov-border-link">Régénérer la proposition</button>`}
          ${!v.profileShowPrimary ? "" : `
          <button data-click="onProfile" ${v.profileBtnDisabled ? "disabled" : ""} style="height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:${v.profileBtnCursor};display:flex;align-items:center;gap:8px;opacity:${v.profileBtnOpacity}" class="hov-primary-dark">
            ${!v.profileBusy ? "" : `<div style="width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite"></div>`}
            ${esc(v.profileBtnLabel)}
          </button>`}
          ${!v.profileDone ? "" : `<button data-click="gotoStep" data-step="4" style="height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer" class="hov-primary-dark">Vérifier l’état du corpus</button>`}
          ${!v.profileDone ? "" : `<button data-click="onProfile" style="background:none;border:none;padding:0;font-size:12px;color:var(--text-secondary);text-decoration:underline;cursor:pointer" class="hov-text">Relancer le profiling</button>`}
          <span style="font-size:11.5px;color:var(--text-secondary)">${esc(v.profileHint)}</span>
        </div>
      </div>
    </div>`;

  /* ---- carte 4 : corpus prêt ---- */
  document.getElementById("card4").innerHTML = `
    <div style="border:1px solid ${v.card4Border};border-radius:var(--radius);background:${v.card4Bg};box-shadow:var(--shadow)">
      <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)">
        <div style="font-size:14.5px;font-weight:600">4. Corpus prêt</div>
        ${!v.ready ? "" : `
        <div style="display:flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:#EAF7F1">
          <div style="width:5px;height:5px;border-radius:999px;background:var(--success)"></div>
          <span style="font-size:10.5px;font-weight:600;color:#177A53">Prêt</span>
        </div>`}
        <div style="margin-left:auto;font-size:11.5px;color:var(--text-secondary)">${esc(v.readyStateLabel)}</div>
      </div>
      <div style="padding:18px 20px 20px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
          <div style="display:flex;flex-direction:column;gap:9px">
            ${v.checklist.map(c => `
              <div style="display:flex;align-items:center;gap:9px">
                <span style="width:13px;text-align:center;font-size:12px;color:${c.tint}">${c.mark}</span>
                <span style="font-size:13px;color:${c.textColor}">${esc(c.label)}</span>
              </div>`).join("")}
          </div>
          <div style="border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:14px 15px;display:flex;flex-direction:column;gap:7px">
            ${v.summaryRows.map(r => `
              <div style="display:flex;align-items:baseline;gap:10px">
                <span style="font-size:11.5px;color:var(--text-secondary);min-width:140px">${esc(r.label)}</span>
                <span style="font-size:12.5px">${esc(r.value)}</span>
              </div>`).join("")}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap">
          <a href="${esc(v.interrogateHref)}" style="height:38px;padding:0 18px;border-radius:var(--radius-sm);background:${v.readyBtnBg};color:${v.readyBtnColor};font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;pointer-events:${v.readyBtnEvents};opacity:${v.readyBtnOpacity}" class="hov-brightness94">Commencer à interroger ce corpus<span style="font-size:13px">→</span></a>
          <span style="font-size:11.5px;color:var(--text-secondary)">${esc(v.readyHint)}</span>
        </div>
      </div>
    </div>`;

  /* ---- modale création ---- */
  document.getElementById("create-modal-region").innerHTML = !v.showCreateModal ? "" : `
    <div style="position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:50">
      <div style="width:420px;max-width:calc(100vw - 40px);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;box-sizing:border-box">
        <div style="font-size:15px;font-weight:600;margin-bottom:4px">Nouveau corpus</div>
        <div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:16px;line-height:1.5">Déclare un nouveau corpus logique. L’indexation se fait ensuite séparément, depuis l’étape 2.</div>

        <label for="create-nom" style="display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">Nom du corpus</label>
        <input id="create-nom" data-bind="createName" type="text" value="${esc(v.createName)}" placeholder="ex. Ressources humaines" style="width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text-primary);outline:none;box-sizing:border-box" class="foc-border">

        <label for="create-id" style="display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin:14px 0 6px">Identifiant (corpus_id)</label>
        <input id="create-id" data-bind="createId" type="text" value="${esc(v.createId)}" placeholder="ex. ressources-humaines" style="width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;font-family:'IBM Plex Mono',monospace;color:var(--text-primary);outline:none;box-sizing:border-box" class="foc-border">
        <div style="font-size:11px;color:var(--text-secondary);margin-top:6px">Minuscules, chiffres, tirets et underscores uniquement.</div>

        ${!v.createError ? "" : `<div style="margin-top:12px;font-size:12px;color:var(--error);line-height:1.5">${esc(v.createError)}</div>`}

        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
          <button data-click="onCloseCreateModal" ${v.createBusy ? "disabled" : ""} style="height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer" class="hov-border">Annuler</button>
          <button data-click="onSubmitCreateCorpus" ${v.createSubmitDisabled ? "disabled" : ""} style="height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;opacity:${v.createSubmitOpacity}" class="hov-primary-dark">
            ${!v.createBusy ? "" : `<div style="width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite"></div>`}
            ${esc(v.createSubmitLabel)}
          </button>
        </div>
      </div>
    </div>`;

  /* ---- modale suppression ---- */
  document.getElementById("delete-modal-region").innerHTML = !v.showDeleteModal ? "" : `
    <div style="position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:50">
      <div style="width:420px;max-width:calc(100vw - 40px);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;box-sizing:border-box">
        <div style="font-size:15px;font-weight:600;margin-bottom:10px">Supprimer le corpus « ${esc(v.deleteModalName)} » ?</div>
        <div style="font-size:12.5px;line-height:1.6;color:var(--text-secondary)">Les documents importés, l’index Qdrant et les données associées à ce corpus seront supprimés définitivement.</div>
        ${!v.deleteError ? "" : `<div style="margin-top:12px;font-size:12px;color:var(--error);line-height:1.5">${esc(v.deleteError)}</div>`}
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
          <button data-click="onCloseDeleteModal" ${v.deleteBusy ? "disabled" : ""} style="height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer" class="hov-border">Annuler</button>
          <button data-click="onConfirmDeleteCorpus" ${v.deleteBusy ? "disabled" : ""} style="height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--error);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px" class="hov-brightness9">
            ${!v.deleteBusy ? "" : `<div style="width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite"></div>`}
            Supprimer
          </button>
        </div>
      </div>
    </div>`;

  restoreUi(ui);
}

/* ---------------------------------------------------------------- */
/* Délégation d’événements                                            */
/* ---------------------------------------------------------------- */

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-click]");
  if (!el) return;
  const action = el.dataset.click;
  const id = el.dataset.id;
  switch (action) {
    case "onNewCorpus": openCreateModal(); break;
    case "selectCorpus": select(id); break;
    case "onCloseCreateModal": closeCreateModal(); break;
    case "onSubmitCreateCorpus": submitCreateCorpus(); break;
    case "onDeleteCorpus": openDeleteModal(); break;
    case "onCloseDeleteModal": closeDeleteModal(); break;
    case "onConfirmDeleteCorpus": confirmDeleteCorpus(); break;
    case "openFolderPicker": openFolderPicker(); break;
    case "openFilesPicker": openFilesPicker(); break;
    case "toggleConnectorPanel": toggleConnectorPanel(); break;
    case "toggleUrlPanel": toggleUrlPanel(); break;
    case "onImportUrlSubmit": submitImportUrl(); break;
    case "gotoStep": setState({ step: Number(el.dataset.step) }); break;
    case "onIndex": runIndex(); break;
    case "onProfile": runProfile(); break;
    case "onValidateProfile": validateProfile(); break;
    case "addKeyword": addKeyword(); break;
    case "removeKeyword": removeKeyword(el.dataset.key); break;
    case "setDomain": setState({ inputDomain: el.dataset.domain }); break;
  }
});

document.addEventListener("input", (e) => {
  const key = e.target.dataset && e.target.dataset.bind;
  if (!key) return;
  if (key === "createName") onCreateNameChange(e.target.value);
  else if (key === "createId") onCreateIdChange(e.target.value);
  else setState({ [key]: e.target.value });
});

document.addEventListener("keydown", (e) => {
  const action = e.target.dataset && e.target.dataset.enter;
  if (!action) return;
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (action === "runProfile") runProfile();
  else if (action === "addKeyword") addKeyword();
});

document.getElementById("folder-input").addEventListener("change", onFolderPicked);
document.getElementById("files-input").addEventListener("change", onFilesPicked);

/* ---------------------------------------------------------------- */
/* Démarrage (équivalent à componentDidMount)                        */
/* ---------------------------------------------------------------- */

render();
load();
</script>
</body>
</html>
