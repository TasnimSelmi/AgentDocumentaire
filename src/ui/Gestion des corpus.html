document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  --radius:8px;\n  --radius-sm:6px;\n  --shadow:0 1px 2px rgba(31,42,58,.05);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;height:100%}\nbody{background:var(--background);-webkit-font-smoothing:antialiased}\na{color:var(--brand-primary);text-decoration:none}\na:hover{color:var(--brand-primary-dark)}\ntextarea,button,input{font-family:inherit}\n::selection{background:#BFDDFA}\n@keyframes om-spin{to{transform:rotate(360deg)}}\n@keyframes om-pulse{0%,100%{opacity:1}50%{opacity:.55}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:flex;flex-direction:column;font-family:Poppins,Helvetica,sans-serif;color:var(--text-primary);background:var(--background);overflow:hidden\">\n\n  <header style=\"flex:none;height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)\">\n    <img src=\"122caf6b-712f-4d85-b1b5-5f223af60541\" alt=\"INSY2S\" style=\"height:26px;width:auto;display:block\">\n    <div style=\"width:1px;height:26px;background:var(--border)\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:1px\">\n      <div style=\"font-size:14.5px;font-weight:600;letter-spacing:-.01em\">Agent Documentaire<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:var(--text-secondary);font-weight:400\">Préparation des corpus documentaires<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:7px\">\n      <div style=\"width:7px;height:7px;border-radius:999px;background:{{ statusDot }}\"><\u002Fdiv>\n      <span style=\"font-size:12px;font-weight:500;color:var(--text-secondary)\">{{ statusLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1px;height:26px;background:var(--border)\"><\u002Fdiv>\n    <div style=\"font-size:12.5px;color:var(--text-secondary)\">{{ userName }}<\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:1;min-height:0;overflow-y:auto\">\n    <div style=\"max-width:1000px;margin:0 auto;padding:30px 32px 56px\">\n\n      <div style=\"display:flex;align-items:flex-start;gap:24px\">\n        <div>\n          <h1 style=\"margin:0;font-size:23px;font-weight:600;line-height:1.3\">Gestion des corpus<\u002Fh1>\n          <p style=\"margin:8px 0 0;max-width:600px;font-size:14px;line-height:1.6;color:var(--text-secondary)\">Préparez, indexez et configurez un corpus avant son utilisation par l’Agent Documentaire.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <a href=\"Agent Documentaire.html\" style=\"flex:none;height:34px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);display:flex;align-items:center;gap:7px\" style-hover=\"border-color:#B7D6F6;color:var(--brand-primary-dark)\">Ouvrir l’Agent Documentaire<span style=\"font-size:12px\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:26px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface-alt);border-radius:var(--radius) var(--radius) 0 0\">\n          <span style=\"font-size:11.5px;font-weight:600;color:var(--text-secondary)\">Corpus disponibles<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-secondary)\">{{ corpusCount }}<\u002Fspan>\n          <sc-if value=\"{{ deleteNotice }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:11.5px;color:#177A53\">{{ deleteNotice }}<\u002Fspan>\n          <\u002Fsc-if>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onNewCorpus }}\" style=\"height:28px;padding:0 11px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text-primary);cursor:pointer\" style-hover=\"border-color:#B7D6F6;color:var(--brand-primary-dark)\">+ Nouveau corpus<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0\">\n          <sc-for list=\"{{ corpora }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"text-align:left;background:{{ c.bg }};border:none;border-right:1px solid var(--border);padding:15px 16px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px\" style-hover=\"background:var(--surface-alt)\">\n              <span style=\"display:flex;align-items:center;gap:8px;width:100%\">\n                <span style=\"font-size:13.5px;font-weight:600\">{{ c.name }}<\u002Fspan>\n                <span style=\"margin-left:auto;display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:{{ c.badgeBg }}\">\n                  <span style=\"width:5px;height:5px;border-radius:999px;background:{{ c.badgeDot }}\"><\u002Fspan>\n                  <span style=\"font-size:10.5px;font-weight:600;color:{{ c.badgeText }}\">{{ c.status }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:11.5px;color:var(--text-secondary)\">{{ c.meta }}<\u002Fspan>\n              <span style=\"font-size:11px;color:var(--text-secondary)\">{{ c.source }}<\u002Fspan>\n              <span style=\"font-size:11px;color:{{ c.hintColor }}\">{{ c.hint }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:26px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px 18px\">\n        <div style=\"display:flex;align-items:center;gap:0\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ s.onClick }}\" disabled=\"{{ s.locked }}\" style=\"flex:1;background:none;border:none;padding:0;cursor:{{ s.cursor }};display:flex;align-items:center;gap:9px;min-width:0\">\n              <span style=\"flex:none;width:22px;height:22px;border-radius:999px;border:1px solid {{ s.ringColor }};background:{{ s.circleBg }};color:{{ s.circleText }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600\">{{ s.mark }}<\u002Fspan>\n              <span style=\"min-width:0;text-align:left\">\n                <span style=\"display:block;font-size:12.5px;font-weight:{{ s.weight }};color:{{ s.labelColor }};white-space:nowrap\">{{ s.label }}<\u002Fspan>\n                <span style=\"display:block;font-size:10.5px;color:var(--text-secondary);margin-top:1px\">{{ s.state }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"flex:1;height:1px;background:{{ s.lineColor }};margin:0 4px;min-width:12px;display:{{ s.lineDisplay }}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:14px\">\n\n        <div style=\"border:1px solid {{ card1Border }};border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)\">\n            <div style=\"font-size:14.5px;font-weight:600\">1. Ajouter un corpus<\u002Fdiv>\n            <div style=\"margin-left:auto;font-size:11.5px;color:var(--text-secondary)\">{{ step1State }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 20px 20px\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n              <div style=\"border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 15px\">\n                <div style=\"font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:10px\">Corpus sélectionné<\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:600\">{{ activeName }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:11px\">\n                  <sc-for list=\"{{ activeRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:baseline;gap:10px\">\n                      <span style=\"font-size:11.5px;color:var(--text-secondary);min-width:132px\">{{ r.label }}<\u002Fspan>\n                      <span style=\"font-size:12.5px\">{{ r.value }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ canDeleteCorpus }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ onDeleteCorpus }}\" style=\"margin-top:12px;height:30px;padding:0 12px;border:1px solid #EFD9D3;background:#FFFCFB;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--error);cursor:pointer;display:inline-flex;align-items:center;gap:6px\" style-hover=\"background:var(--error);color:#fff;border-color:var(--error)\">Supprimer ce corpus<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ deleteError }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11px;color:var(--error);margin-top:6px\">{{ deleteError }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"border:1px dashed #CFD6DD;border-radius:var(--radius-sm);background:#FBFCFD;padding:14px 15px;display:flex;flex-direction:column\">\n                <div style=\"font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:10px\">Connecter une nouvelle source<\u002Fdiv>\n                <div style=\"font-size:12.5px;line-height:1.6;color:var(--text-secondary)\">Déposez un dossier de documents ici, ou reliez un espace documentaire existant.<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:12px\">\n                  <sc-for list=\"{{ sourceOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"height:30px;padding:0 11px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12px;color:var(--text-primary);cursor:pointer\" style-hover=\"border-color:#B7D6F6;color:var(--brand-primary-dark)\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--text-secondary);line-height:1.5;margin-top:8px\">{{ folderHint }}<\u002Fdiv>\n\n                <input type=\"file\" id=\"folder-input\" webkitdirectory=\"\" multiple=\"\" style=\"display:none\" sc-camel-on-change=\"{{ onFolderPicked }}\">\n                <input type=\"file\" id=\"files-input\" multiple=\"\" accept=\".pdf,.docx,.txt,.xlsx\" style=\"display:none\" sc-camel-on-change=\"{{ onFilesPicked }}\">\n\n                <sc-if value=\"{{ uploadBusy }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:8px;margin-top:12px\">\n                    <div style=\"width:12px;height:12px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--brand-primary);border-radius:999px;animation:om-spin .7s linear infinite\"><\u002Fdiv>\n                    <span style=\"font-size:12px;color:var(--text-secondary)\">Envoi des fichiers en cours…<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ uploadResultText }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11.5px;color:{{ uploadResultColor }};margin-top:10px\">{{ uploadResultText }}<\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ showConnectorPanel }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:12px;border-top:1px solid var(--border);padding-top:12px\">\n                    <sc-if value=\"{{ connectorsLoading }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px;color:var(--text-secondary)\">Recherche des connecteurs disponibles…<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ hasRemoteConnectors }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;flex-direction:column;gap:6px\">\n                        <sc-for list=\"{{ remoteConnectors }}\" as=\"c\" hint-placeholder-count=\"1\">\n                          <div style=\"font-size:12.5px\">{{ c.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ noRemoteConnectors }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.6\">Aucun connecteur documentaire distant n’est configuré.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ showUrlPanel }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:12px;border-top:1px solid var(--border);padding-top:12px\">\n                    <label style=\"display:block;font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:6px\">URL du document<\u002Flabel>\n                    <div style=\"display:flex;gap:7px\">\n                      <input type=\"text\" value=\"{{ importUrlValue }}\" sc-camel-on-change=\"{{ onImportUrlChange }}\" placeholder=\"https://exemple.com/document.pdf\" style=\"flex:1;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:12px;color:var(--text-primary);outline:none\" style-focus=\"border-color:#B7D6F6\">\n                      <button sc-camel-on-click=\"{{ onImportUrlSubmit }}\" disabled=\"{{ importUrlBusy }}\" style=\"height:30px;padding:0 12px;border:none;background:var(--brand-primary);color:#fff;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--brand-primary-dark)\">{{ importUrlBtnLabel }}<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ importUrlError }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:11px;color:var(--error);margin-top:6px\">{{ importUrlError }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--text-secondary);margin-top:12px\">Formats pris en charge : PDF, DOCX, TXT, XLSX.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:16px\">\n              <button sc-camel-on-click=\"{{ goStep2 }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:var(--brand-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--brand-primary-dark)\">Continuer vers l’indexation<\u002Fbutton>\n              <span style=\"font-size:11.5px;color:var(--text-secondary)\">{{ step1Hint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid {{ card2Border }};border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)\">\n            <div style=\"font-size:14.5px;font-weight:600\">2. Indexer les documents<\u002Fdiv>\n            <div style=\"margin-left:auto;display:flex;align-items:center;gap:7px\">\n              <div style=\"width:6px;height:6px;border-radius:999px;background:{{ indexDot }}\"><\u002Fdiv>\n              <span style=\"font-size:11.5px;color:var(--text-secondary)\">{{ indexStateLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 20px 20px\">\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n              <sc-for list=\"{{ indexStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;color:{{ s.tint }}\">{{ s.value }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:var(--text-secondary);margin-top:3px\">{{ s.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px\">\n              <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:7px\">\n                <span style=\"font-size:12.5px\">{{ indexProgressLabel }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary)\">{{ indexPercentLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:6px;border-radius:3px;background:var(--surface-alt);overflow:hidden\">\n                <div style=\"height:6px;border-radius:3px;background:{{ indexBarColor }};width:{{ indexBarWidth }};transition:width .3s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ indexHasNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;border:1px solid {{ indexNoteBorder }};background:{{ indexNoteBg }};border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--text-primary)\">{{ indexNote }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ onIndex }}\" disabled=\"{{ indexBusy }}\" style=\"height:36px;padding:0 16px;border:none;border-radius:var(--radius-sm);background:{{ indexBtnBg }};color:{{ indexBtnColor }};font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;opacity:{{ indexBtnOpacity }}\" style-hover=\"filter:brightness(.94)\">\n                <sc-if value=\"{{ indexBusy }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite\"><\u002Fdiv>\n                <\u002Fsc-if>\n                {{ indexBtnLabel }}\n              <\u002Fbutton>\n              <sc-if value=\"{{ indexDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ goStep3 }}\" style=\"height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;color:var(--text-primary);cursor:pointer\" style-hover=\"border-color:#B7D6F6;color:var(--brand-primary-dark)\">Continuer vers le profiling<\u002Fbutton>\n              <\u002Fsc-if>\n              <span style=\"font-size:11.5px;color:var(--text-secondary)\">{{ indexHint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid {{ card3Border }};border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)\">\n          <div style=\"display:flex;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)\">\n            <div>\n              <div style=\"font-size:14.5px;font-weight:600\">3. Analyser le corpus<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.6;color:var(--text-secondary);margin-top:4px;max-width:620px\">Indiquez le domaine du corpus : le système génère une proposition de description et de mots-clés métier à partir de ce libellé, que vous pouvez corriger avant validation.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div style=\"flex:none;font-size:11px;color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 9px;white-space:nowrap\">Étape initiale — une seule fois<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 20px 20px\">\n            <sc-if value=\"{{ profileIdle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <div style=\"font-size:12.5px;line-height:1.6;color:var(--text-secondary);max-width:640px\">Indiquez le titre et le domaine du corpus. Le système génère ensuite, à partir du domaine indiqué, une description et des mots-clés métier que vous pouvez corriger avant validation.<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px;max-width:640px\">\n                  <div>\n                    <label for=\"pf-title\" style=\"display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px\">Titre du corpus<\u002Flabel>\n                    <input id=\"pf-title\" type=\"text\" value=\"{{ inputTitle }}\" sc-camel-on-change=\"{{ onTitle }}\" placeholder=\"ex. Corpus RH interne\" style=\"width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text-primary);outline:none\" style-focus=\"border-color:#B7D6F6\">\n                  <\u002Fdiv>\n                  <div>\n                    <label for=\"pf-domain\" style=\"display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px\">Domaine du corpus<\u002Flabel>\n                    <input id=\"pf-domain\" type=\"text\" value=\"{{ inputDomain }}\" sc-camel-on-change=\"{{ onDomain }}\" sc-camel-on-key-down=\"{{ onFieldKey }}\" placeholder=\"ex. Ressources humaines\" style=\"width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text-primary);outline:none\" style-focus=\"border-color:#B7D6F6\">\n                    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px\">\n                      <sc-for list=\"{{ domainSuggestions }}\" as=\"d\" hint-placeholder-count=\"4\">\n                        <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"border:1px solid var(--border);background:var(--surface);border-radius:3px;padding:3px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer\" style-hover=\"border-color:#B7D6F6;color:var(--brand-primary-dark)\">{{ d.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ profileProposed }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px\">\n                  <span style=\"font-size:13px;font-weight:600\">Proposition de profil<\u002Fspan>\n                  <span style=\"font-size:10.5px;font-weight:500;color:var(--brand-accent);background:var(--brand-accent-soft);border-radius:3px;padding:3px 8px\">Généré automatiquement — à valider<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:var(--text-secondary)\">Corrigez librement avant de valider.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr\">\n                    <div style=\"padding:15px 16px;border-right:1px solid var(--border)\">\n                      <div style=\"font-size:11px;font-weight:600;color:var(--text-secondary)\">Domaine retenu<\u002Fdiv>\n                      <div style=\"font-size:14px;font-weight:600;margin-top:5px\">{{ draftDomain }}<\u002Fdiv>\n                      <label for=\"pf-desc\" style=\"display:block;font-size:11px;font-weight:600;color:var(--text-secondary);margin-top:13px;margin-bottom:6px\">Description proposée<\u002Flabel>\n                      <textarea id=\"pf-desc\" rows=\"4\" value=\"{{ draftDescription }}\" sc-camel-on-change=\"{{ onDescription }}\" style=\"width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:12.5px;line-height:1.6;color:var(--text-primary);outline:none;resize:vertical\" style-focus=\"border-color:#B7D6F6\"><\u002Ftextarea>\n                      <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:11px\">\n                        <span style=\"font-size:11.5px;color:var(--text-secondary);min-width:120px\">Langue principale<\u002Fspan>\n                        <span style=\"font-size:12.5px\">{{ profileLanguage }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:7px\">\n                        <span style=\"font-size:11.5px;color:var(--text-secondary);min-width:120px\">Période couverte<\u002Fspan>\n                        <span style=\"font-size:12.5px\">{{ profilePeriod }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:15px 16px;background:#FBFCFD\">\n                      <div style=\"font-size:11px;font-weight:600;color:var(--text-secondary)\">Types de documents identifiés<\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:9px\">\n                        <sc-for list=\"{{ profileTypes }}\" as=\"t\" hint-placeholder-count=\"4\">\n                          <div style=\"display:flex;align-items:baseline;gap:10px\">\n                            <span style=\"font-size:12.5px\">{{ t.label }}<\u002Fspan>\n                            <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-secondary)\">{{ t.count }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"height:1px;background:var(--border);margin:14px 0\"><\u002Fdiv>\n                      <div style=\"font-size:11px;font-weight:600;color:var(--text-secondary)\">Mots-clés et catégories proposés<\u002Fdiv>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\">\n                        <sc-for list=\"{{ draftKeywords }}\" as=\"k\" hint-placeholder-count=\"5\">\n                          <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--brand-primary-dark);background:var(--brand-primary-soft);border:1px solid #D3E5FB;border-radius:3px;padding:3px 6px 3px 8px\">{{ k.label }}<button sc-camel-on-click=\"{{ k.onRemove }}\" title=\"Retirer\" style=\"background:none;border:none;padding:0;font-size:11px;line-height:1;color:var(--brand-primary-dark);cursor:pointer\">×<\u002Fbutton><\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;gap:7px;margin-top:10px\">\n                        <input type=\"text\" value=\"{{ newKeyword }}\" sc-camel-on-change=\"{{ onNewKeyword }}\" sc-camel-on-key-down=\"{{ onKeywordKey }}\" placeholder=\"Ajouter un mot-clé\" style=\"flex:1;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:12px;color:var(--text-primary);outline:none\" style-focus=\"border-color:#B7D6F6\">\n
