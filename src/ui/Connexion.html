<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Connexion — interface volontairement factice (mockée).           */
/* Aucun appel réseau n’est effectué ici : voir docs/DO_NOT_TOUCH.md. */
/* ------------------------------------------------------------------ */

const props = { showStateBar: true };

const state = {
  mode: "login",
  email: "",
  password: "",
  fullName: "",
  confirm: "",
  remember: true,
  accepted: false,
  busy: false,
  error: "",
  success: "",
  authenticated: false
};

let submitTimer = null;

function setState(patch) {
  Object.assign(state, typeof patch === "function" ? patch(state) : patch);
  render();
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ---- logique métier (identique au comportement original) ---- */

function setField(key, value) {
  setState({ [key]: value, error: "" });
}

function submit() {
  const st = state;
  if (st.busy) return;
  clearTimeout(submitTimer);
  const email = st.email.trim();
  if (!email || email.indexOf("@") < 0) { setState({ error: "Saisissez une adresse professionnelle valide.", success: "" }); return; }

  if (st.mode === "forgot") {
    setState({ busy: true, error: "", success: "" });
    submitTimer = setTimeout(() => setState({ busy: false, success: "Un lien de réinitialisation a été envoyé à " + email + ". Il expire dans 30 minutes." }), 1200);
    return;
  }
  if (st.mode === "signup") {
    if (!st.fullName.trim()) { setState({ error: "Indiquez votre nom et prénom.", success: "" }); return; }
    if (st.password.length < 8) { setState({ error: "Le mot de passe doit contenir au moins 8 caractères.", success: "" }); return; }
    if (st.password !== st.confirm) { setState({ error: "Les deux mots de passe ne correspondent pas.", success: "" }); return; }
    if (!st.accepted) { setState({ error: "Vous devez accepter les conditions d’accès au périmètre interne.", success: "" }); return; }
    setState({ busy: true, error: "", success: "" });
    submitTimer = setTimeout(() => setState({ busy: false, success: "Compte créé. Votre accès est en attente de validation par l’administrateur ; vous pouvez déjà vous connecter.", mode: "login", password: "", confirm: "" }), 1400);
    return;
  }
  if (!st.password) { setState({ error: "Saisissez votre mot de passe.", success: "" }); return; }
  setState({ busy: true, error: "", success: "" });
  submitTimer = setTimeout(() => {
    if (st.password.toLowerCase() === "erreur") {
      setState({ busy: false, error: "Identifiants incorrects. Il reste 2 tentatives avant blocage temporaire du compte." });
    } else {
      setState({ busy: false, authenticated: true, success: "Connexion établie. Redirection vers la gestion des corpus…" });
    }
  }, 1300);
}

function go(mode) {
  setState({ mode, error: "", success: "", authenticated: false, busy: false });
}

/* ---- calcul des valeurs dérivées (équivalent à renderVals()) ---- */

function computeVals() {
  const st = state;
  const isLogin = st.mode === "login";
  const isSignup = st.mode === "signup";
  const isForgot = st.mode === "forgot";

  function field(id, label, key, type, placeholder, autoComplete, hint) {
    return {
      id, label, key, type, placeholder, autoComplete: autoComplete || "off",
      value: st[key], hint: hint || "",
      border: st.error ? "#EFD9D3" : "var(--border)"
    };
  }

  let fields;
  if (isForgot) {
    fields = [field("em", "Adresse professionnelle", "email", "email", "prenom.nom@insy2s.com", "email")];
  } else if (isSignup) {
    fields = [
      field("nm", "Nom et prénom", "fullName", "text", "ex. Yassine Ben Amor", "name"),
      field("em", "Adresse professionnelle", "email", "email", "prenom.nom@insy2s.com", "email"),
      field("pw", "Mot de passe", "password", "password", "8 caractères minimum", "new-password", "Au moins 8 caractères, dont un chiffre."),
      field("cf", "Confirmer le mot de passe", "confirm", "password", "Ressaisir le mot de passe", "new-password")
    ];
  } else {
    fields = [
      field("em", "Adresse professionnelle", "email", "email", "prenom.nom@insy2s.com", "email"),
      field("pw", "Mot de passe", "password", "password", "Votre mot de passe", "current-password")
    ];
  }

  function tab(label, mode) {
    return {
      label, mode,
      bg: st.mode === mode ? "var(--surface)" : "var(--surface-alt)",
      underline: st.mode === mode ? "var(--brand-primary)" : "transparent",
      color: st.mode === mode ? "var(--text-primary)" : "var(--text-secondary)",
      weight: st.mode === mode ? 600 : 500
    };
  }

  function chip(label, active, action) {
    return {
      label, action,
      bg: active ? "var(--brand-primary)" : "var(--surface)",
      color: active ? "#fff" : "var(--text-secondary)",
      border: active ? "var(--brand-primary)" : "var(--border)"
    };
  }

  return {
    showStateBar: props.showStateBar ?? true,

    pageTitle: isSignup ? "Créer un compte" : isForgot ? "Réinitialiser l’accès" : "Connexion à l’Agent Documentaire",
    pageSubtitle: isSignup
      ? "Créez votre compte collaborateur pour préparer des corpus et interroger la documentation interne."
      : isForgot
        ? "Indiquez votre adresse professionnelle : un lien de réinitialisation vous sera transmis."
        : "Identifiez-vous pour accéder aux corpus documentaires de votre périmètre.",
    notices: [
      "L’accès est limité aux corpus autorisés pour votre service.",
      "Les questions posées et les documents consultés sont journalisés.",
      "Les nouveaux comptes sont validés par l’administrateur de l’espace documentaire."
    ],

    tabs: [tab("Connexion", "login"), tab("Créer un compte", "signup")],
    isLogin, isSignup, isForgot,
    fields,

    remember: st.remember,
    accepted: st.accepted,

    busy: st.busy,
    submitLabel: st.busy
      ? (isSignup ? "Création du compte…" : isForgot ? "Envoi en cours…" : "Connexion…")
      : (isSignup ? "Créer le compte" : isForgot ? "Envoyer le lien" : "Se connecter"),
    submitDisabled: st.busy,
    submitCursor: st.busy ? "default" : "pointer",
    submitOpacity: st.busy ? 0.75 : 1,

    hasError: !!st.error,
    errorMessage: st.error,
    hasSuccess: !!st.success,
    successMessage: st.success,
    authenticated: st.authenticated,

    switchText: isSignup ? "Vous avez déjà un compte ?" : "Pas encore de compte ?",
    switchAction: isSignup ? "Se connecter" : "Créer un compte",

    stateChips: [
      chip("Connexion", isLogin && !st.busy && !st.error && !st.authenticated, "login"),
      chip("Création de compte", isSignup, "signup"),
      chip("Mot de passe oublié", isForgot, "forgot"),
      chip("Chargement", st.busy, "loading"),
      chip("Identifiants incorrects", !!st.error, "error"),
      chip("Compte créé", st.success.indexOf("Compte créé") === 0, "created"),
      chip("Connecté", st.authenticated, "connected")
    ]
  };
}

/* ---- rendu ---- */

function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  const selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;

  const v = computeVals();

  document.getElementById("page-title").textContent = v.pageTitle;
  document.getElementById("page-subtitle").textContent = v.pageSubtitle;

  document.getElementById("notices").innerHTML = v.notices.map(n => `
    <div style="display:flex;gap:9px;align-items:baseline">
      <div style="flex:none;width:4px;height:4px;border-radius:999px;background:var(--brand-accent);transform:translateY(-3px)"></div>
      <span style="font-size:12.5px;line-height:1.6;color:var(--text-secondary)">${esc(n)}</span>
    </div>`).join("");

  document.getElementById("tabs").innerHTML = v.tabs.map(t => `
    <button data-click="go" data-mode="${t.mode}" style="flex:1;height:44px;background:${t.bg};border:none;border-bottom:2px solid ${t.underline};font-size:12.5px;font-weight:${t.weight};color:${t.color};cursor:pointer" class="hov-text">${esc(t.label)}</button>`).join("");

  document.getElementById("error-banner").innerHTML = !v.hasError ? "" : `
    <div style="border:1px solid #EFD9D3;background:#FFFCFB;border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:16px;display:flex;gap:9px;align-items:baseline">
      <div style="flex:none;width:6px;height:6px;border-radius:999px;background:var(--error);transform:translateY(-2px)"></div>
      <span style="font-size:12.5px;line-height:1.55;color:var(--text-primary)">${esc(v.errorMessage)}</span>
    </div>`;

  document.getElementById("success-banner").innerHTML = !v.hasSuccess ? "" : `
    <div style="border:1px solid #D9EDE4;background:#FBFDFC;border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:16px;display:flex;gap:9px;align-items:baseline">
      <span style="flex:none;font-size:12px;color:var(--success)">✓</span>
      <span style="font-size:12.5px;line-height:1.55;color:var(--text-primary)">${esc(v.successMessage)}</span>
    </div>`;

  document.getElementById("fields").innerHTML = v.fields.map(f => `
    <div>
      <label for="${f.id}" style="display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">${esc(f.label)}</label>
      <input id="${f.id}" data-bind="${f.key}" type="${f.type}" value="${esc(f.value)}" autocomplete="${f.autoComplete}" placeholder="${esc(f.placeholder)}" style="width:100%;height:38px;padding:0 11px;border:1px solid ${f.border};border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text-primary);outline:none" class="foc-border">
      ${f.hint ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:5px;line-height:1.5">${esc(f.hint)}</div>` : ""}
    </div>`).join("");

  document.getElementById("login-extra").innerHTML = !v.isLogin ? "" : `
    <div style="display:flex;align-items:center;gap:10px;margin-top:13px">
      <label for="keep" style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input id="keep" data-bind-checked="remember" type="checkbox" ${v.remember ? "checked" : ""} style="width:14px;height:14px;accent-color:#0B78E8;cursor:pointer">
        <span style="font-size:12px;color:var(--text-secondary)">Rester connecté</span>
      </label>
      <div style="flex:1"></div>
      <button data-click="go" data-mode="forgot" style="background:none;border:none;padding:0;font-size:12px;color:var(--brand-primary);cursor:pointer" class="hov-link-dark">Mot de passe oublié</button>
    </div>`;

  document.getElementById("signup-extra").innerHTML = !v.isSignup ? "" : `
    <div style="display:flex;align-items:flex-start;gap:8px;margin-top:13px">
      <input id="cgu" data-bind-checked="accepted" type="checkbox" ${v.accepted ? "checked" : ""} style="width:14px;height:14px;margin-top:2px;accent-color:#0B78E8;cursor:pointer">
      <label for="cgu" style="font-size:12px;line-height:1.55;color:var(--text-secondary);cursor:pointer">Je reconnais que les documents consultés relèvent du périmètre interne et sont soumis à la politique de confidentialité de l’entreprise.</label>
    </div>`;

  const submitBtn = document.getElementById("submit-btn");
  submitBtn.style.cursor = v.submitCursor;
  submitBtn.style.opacity = v.submitOpacity;
  submitBtn.disabled = v.submitDisabled;
  submitBtn.innerHTML = (v.busy ? `<div style="width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:999px;animation:om-spin .7s linear infinite"></div>` : "") + esc(v.submitLabel);

  document.getElementById("forgot-back").innerHTML = !v.isForgot ? "" : `
    <button data-click="go" data-mode="login" style="width:100%;height:34px;margin-top:9px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text-primary);cursor:pointer" class="hov-border-link">Retour à la connexion</button>`;

  document.getElementById("authenticated-link").innerHTML = !v.authenticated ? "" : `
    <a href="Gestion des corpus.html" style="width:100%;height:38px;margin-top:9px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;justify-content:center;gap:8px" class="hov-border-link">Accéder à la gestion des corpus<span style="font-size:12px">→</span></a>`;

  document.getElementById("switch-text").textContent = v.switchText;
  document.getElementById("switch-action").textContent = v.switchAction;

  document.getElementById("state-bar").innerHTML = !v.showStateBar ? "" : `
    <div style="flex:none;border-top:1px solid var(--border);background:var(--surface-alt);padding:10px 24px 12px">
      <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px">Prototype — aperçu des états</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${v.stateChips.map(c => `<button data-click="chip" data-chip="${c.action}" style="border:1px solid ${c.border};background:${c.bg};color:${c.color};border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer">${esc(c.label)}</button>`).join("")}
      </div>
    </div>`;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

/* ---- états "prototype" pour la barre d’aperçu (identiques à l’original) ---- */

const CHIP_ACTIONS = {
  login: () => go("login"),
  signup: () => go("signup"),
  forgot: () => go("forgot"),
  loading: () => { clearTimeout(submitTimer); setState({ busy: true, error: "", success: "" }); },
  error: () => setState({ busy: false, mode: "login", error: "Identifiants incorrects. Il reste 2 tentatives avant blocage temporaire du compte.", success: "", authenticated: false }),
  created: () => setState({ busy: false, mode: "login", error: "", success: "Compte créé. Votre accès est en attente de validation par l’administrateur ; vous pouvez déjà vous connecter.", authenticated: false }),
  connected: () => setState({ busy: false, mode: "login", error: "", success: "Connexion établie. Redirection vers la gestion des corpus…", authenticated: true })
};

/* ---- délégation d’événements ---- */

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-click]");
  if (!el) return;
  const action = el.dataset.click;
  if (action === "go") go(el.dataset.mode);
  else if (action === "submit") submit();
  else if (action === "switch") go(state.mode === "signup" ? "login" : "signup");
  else if (action === "chip") { const fn = CHIP_ACTIONS[el.dataset.chip]; if (fn) fn(); }
});

document.addEventListener("input", (e) => {
  const key = e.target.dataset && e.target.dataset.bind;
  if (key) setField(key, e.target.value);
});

document.addEventListener("change", (e) => {
  const key = e.target.dataset && e.target.dataset.bindChecked;
  if (key) setState({ [key]: e.target.checked, error: key === "accepted" ? "" : state.error });
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.bind) {
    e.preventDefault();
    submit();
  }
});

render();
</script>
</body>
</html>
